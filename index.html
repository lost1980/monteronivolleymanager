<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: sans-serif; color: #555;">
            <h2>Caricamento applicazione in corso...</h2>
        </div>
    </div>

    <!-- Firebase SDKs & Configurazione Reale -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyo2mckgZE2MahMFYGOX3h1iM1XhXrF7c",
            authDomain: "monteronivolleymanager.firebaseapp.com",
            projectId: "monteronivolleymanager",
            storageBucket: "monteronivolleymanager.firebasestorage.app",
            messagingSenderId: "167180215755",
            appId: "1:167180215755:web:ff3712b5dc0bc6879d424e"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const appId = 'monteroni-volley-atlete';

            window.firebaseDB = { db, auth, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc, getDoc, setDoc, appId };
            
            signInAnonymously(auth).catch((error) => {
                console.error("Errore autenticazione anonima:", error);
            });

            window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) {
            console.error("Errore inizializzazione Firebase:", err);
        }
    </script>

    <!-- Codice dell'Applicazione React -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = ['', 'B2', '1D', 'U19', 'U17', 'U15', 'U13', 'S3'];
        const PAYMENT_STATUSES = ['', 'NON DOVUTO', 'DA PAGARE', 'PAGATO'];
        const DOC_TYPES = ['', 'CARTA D\'IDENTITÀ', 'PATENTE', 'PASSAPORTO'];

        const CATEGORY_COLORS = {
            'B2': 'bg-purple-100 text-purple-800 border-purple-200',
            '1D': 'bg-blue-100 text-blue-800 border-blue-200',
            'U19': 'bg-indigo-100 text-indigo-800 border-indigo-200',
            'U17': 'bg-cyan-100 text-cyan-800 border-cyan-200',
            'U15': 'bg-teal-100 text-teal-800 border-teal-200',
            'U13': 'bg-emerald-100 text-emerald-800 border-emerald-200',
            'S3': 'bg-amber-100 text-amber-800 border-amber-200',
            '': 'bg-slate-100 text-slate-400 border-slate-200'
        };

        function App() {
            const [user, setUser] = useState(localStorage.getItem('monteroni_user') || null);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');
            const [changePassModal, setChangePassModal] = useState(false);
            const [newPass, setNewPass] = useState('');

            const [atlete, setAtlete] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TUTTE');
            const [modalOpen, setModalOpen] = useState(false);
            const [importModalOpen, setImportModalOpen] = useState(false);
            const [currentAtleta, setCurrentAtleta] = useState(null);
            const [importPreview, setImportPreview] = useState([]);
            const [importing, setImporting] = useState(false);
            const [toast, setToast] = useState(null);

            const [formData, setFormData] = useState({
                cognomeNome: '',
                matricola: '',
                anno: new Date().getFullYear().toString(),
                codiceFiscale: '',
                dataNascita: '',
                societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                categoria: '',
                secondaCategoria: '',
                numeroMaglia: 'Non assegnato',
                tipoDocumento: '',
                numeroDocumento: '',
                dataCertificato: '',
                quotaIscrizione: '',
                note: ''
            });

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError('');
                const u = loginUser.trim().toLowerCase();
                const p = loginPass.trim();

                if (!u) {
                    setLoginError('Inserisci un nome utente');
                    return;
                }

                if (!window.firebaseDB) {
                    setLoginError('Connessione database in corso...');
                    return;
                }

                try {
                    const { db, doc, getDoc, appId } = window.firebaseDB;
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', u);
                    const snap = await getDoc(userRef);

                    if (!snap.exists()) {
                        setLoginError('Utente non autorizzato');
                        return;
                    }

                    const currentPassword = snap.data().password || 'temp';

                    if (p === currentPassword) {
                        setUser(u);
                        localStorage.setItem('monteroni_user', u);
                    } else {
                        setLoginError('Credenziali non valide');
                    }
                } catch (err) {
                    console.error("Errore login:", err);
                    setLoginError('Errore durante il login');
                }
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('monteroni_user');
                setLoginUser('');
                setLoginPass('');
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                if (!newPass.trim()) {
                    alert('Inserisci una password valida');
                    return;
                }

                try {
                    const { db, doc, updateDoc, appId } = window.firebaseDB;
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', user);
                    await updateDoc(userRef, { password: newPass.trim() });
                    showToast('Password modificata con successo!');
                    setChangePassModal(false);
                    setNewPass('');
                } catch (err) {
                    console.error("Errore cambio password:", err);
                    showToast('Errore durante il salvataggio della password', 'error');
                }
            };

            useEffect(() => {
                if (!user) return;

                const initListener = () => {
                    if (!window.firebaseDB) {
                        setTimeout(initListener, 100);
                        return;
                    }
                    const { db, collection, onSnapshot, appId } = window.firebaseDB;
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'atlete');
                    
                    const unsubscribe = onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach((docSnap) => {
                            items.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setAtlete(items);
                        setLoading(false);
                    }, (error) => {
                        console.error("Errore lettura database:", error);
                        setLoading(false);
                        showToast("Errore di connessione al database", "error");
                    });

                    return () => unsubscribe();
                };

                if (window.firebaseDB) {
                    initListener();
                } else {
                    window.addEventListener('firebase-ready', initListener);
                }
            }, [user]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const cleanSocieta = (val) => {
                if (!val) return 'MONTERONI VOLLEY A.S.D.';
                let str = val.toString().trim();
                str = str.replace(/^[\/\-\s]+/, '');
                return str.toUpperCase();
            };

            const parseDateParts = (dateStr) => {
                try {
                    if (!dateStr) return null;
                    let str = dateStr.toString().trim();
                    if (!str) return null;

                    let parts = [];
                    if (str.includes('/')) {
                        parts = str.split('/');
                    } else if (str.includes('-')) {
                        parts = str.split('-');
                    }

                    if (parts.length !== 3) return null;

                    let d, m, y;
                    if (parts[0].length === 4) {
                        y = parseInt(parts[0], 10);
                        m = parseInt(parts[1], 10);
                        d = parseInt(parts[2], 10);
                    } else {
                        d = parseInt(parts[0], 10);
                        m = parseInt(parts[1], 10);
                        y = parseInt(parts[2], 10);
                    }

                    if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
                    return { d, m, y };
                } catch (e) {
                    return null;
                }
            };

            const formatDateDisplay = (dateStr) => {
                const p = parseDateParts(dateStr);
                if (!p) return dateStr || 'Assente';
                return `${String(p.d).padStart(2, '0')}/${String(p.m).padStart(2, '0')}/${p.y}`;
            };

            const getCertStatus = (dateStr) => {
                const p = parseDateParts(dateStr);
                if (!p) return 'red';

                const expiryVal = p.y * 10000 + p.m * 100 + p.d;
                const todayVal = 2026 * 10000 + 11 * 100 + 11; // 11/11/2026

                if (expiryVal < todayVal) {
                    return 'red';
                }

                const twoMonthsVal = 2027 * 10000 + 1 * 100 + 11;

                if (expiryVal <= twoMonthsVal) {
                    return 'yellow';
                }

                return 'green';
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!window.firebaseDB) return;

                const cfPulito = formData.codiceFiscale.trim().toUpperCase();

                if (!currentAtleta) {
                    const esiste = atlete.some(a => (a.codiceFiscale || '').trim().toUpperCase() === cfPulito);
                    if (esiste) {
                        alert("Atleta già inserita");
                        return;
                    }
                }

                const { db, collection, addDoc, updateDoc, doc, appId } = window.firebaseDB;
                const payload = {
                    ...formData,
                    cognomeNome: formData.cognomeNome.trim().toUpperCase(),
                    codiceFiscale: cfPulito,
                    societaAppartenenza: cleanSocieta(formData.societaAppartenenza),
                    numeroMaglia: formData.numeroMaglia ? formData.numeroMaglia.trim() : 'Non assegnato',
                    tipoDocumento: formData.tipoDocumento ? formData.tipoDocumento.trim() : '',
                    numeroDocumento: formData.numeroDocumento ? formData.numeroDocumento.trim().toUpperCase() : '',
                    updatedAt: new Date().toISOString()
                };

                try {
                    if (currentAtleta) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', currentAtleta.id), payload);
                        showToast("Atleta aggiornata con successo");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'), {
                            ...payload,
                            createdAt: new Date().toISOString()
                        });
                        showToast("Atleta inserita con successo");
                    }
                    setModalOpen(false);
                    resetForm();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    showToast("Errore durante il salvataggio", "error");
                }
            };

            const resetForm = () => {
                setFormData({
                    cognomeNome: '',
                    matricola: '',
                    anno: new Date().getFullYear().toString(),
                    codiceFiscale: '',
                    dataNascita: '',
                    societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                    categoria: '',
                    secondaCategoria: '',
                    numeroMaglia: 'Non assegnato',
                    tipoDocumento: '',
                    numeroDocumento: '',
                    dataCertificato: '',
                    quotaIscrizione: '',
                    note: ''
                });
                setCurrentAtleta(null);
            };

            const handleDelete = async (id) => {
                if (!confirm("Sei sicuro di voler eliminare questa atleta?")) return;
                if (!window.firebaseDB) return;
                const { db, doc, deleteDoc, appId } = window.firebaseDB;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', id));
                    showToast("Atleta eliminata");
                } catch (err) {
                    console.error("Errore eliminazione:", err);
                    showToast("Errore durante l'eliminazione", "error");
                }
            };

            const handleClearDatabase = async () => {
                if (!confirm("ATTENZIONE: Stai per eliminare TUTTE le atlete presenti nel database cloud. Vuoi procedere?")) return;
                if (!confirm("Conferma definitiva: Vuoi davvero svuotare completamente l'archivio?")) return;
                
                if (!window.firebaseDB) return;
                const { db, doc, deleteDoc, appId } = window.firebaseDB;
                setLoading(true);

                try {
                    for (const atleta of atlete) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', atleta.id));
                    }
                    showToast("Archivio svuotato con successo");
                } catch (err) {
                    console.error("Errore svuotamento database:", err);
                    showToast("Errore durante lo svuotamento", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const parsedAtlete = [];
                        rows.forEach((row) => {
                            const colA = row[0]; 
                            const colB = row[1]; 
                            const colC = row[2]; 
                            const colE = row[4]; 
                            const colF = row[5]; 
                            const colP = row[15]; 
                            const colAB = row[27]; 

                            if (colC && colE) {
                                const nomeStr = colC.toString().trim().toUpperCase();
                                const cfStr = colE.toString().trim().toUpperCase();

                                if (nomeStr.includes('COGNOME') || cfStr.includes('CODICE') || cfStr.includes('CF')) {
                                    return;
                                }

                                parsedAtlete.push({
                                    anno: colA ? colA.toString() : new Date().getFullYear().toString(),
                                    matricola: colB ? colB.toString() : '',
                                    cognomeNome: nomeStr,
                                    codiceFiscale: cfStr,
                                    dataNascita: parseExcelDate(colF),
                                    societaAppartenenza: cleanSocieta(colP),
                                    categoria: '',
                                    secondaCategoria: '',
                                    numeroMaglia: 'Non assegnato',
                                    tipoDocumento: '',
                                    numeroDocumento: '',
                                    dataCertificato: parseExcelDate(colAB),
                                    quotaIscrizione: '',
                                    note: ''
                                });
                            }
                        });

                        if (parsedAtlete.length === 0) {
                            alert("Nessuna atleta trovata nel file. Verifica la corrispondenza delle colonne.");
                            return;
                        }

                        setImportPreview(parsedAtlete);
                        setImportModalOpen(true);
                    } catch (err) {
                        console.error("Errore lettura file:", err);
                        alert("Errore nella lettura del file Excel/CSV.");
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const parseExcelDate = (val) => {
                if (!val) return '';
                if (typeof val === 'number') {
                    const date = XLSX.SSF.parse_date_code(val);
                    if (date) {
                        return `${String(date.d).padStart(2, '0')}/${String(date.m).padStart(2, '0')}/${date.y}`;
                    }
                }
                return val.toString().trim();
            };

            const confirmImport = async () => {
                if (!window.firebaseDB || importPreview.length === 0) return;
                setImporting(true);

                const { db, collection, writeBatch, doc, appId } = window.firebaseDB;
                let duplicateCount = 0;
                let successCount = 0;

                try {
                    const existingCFs = new Set(atlete.map(a => (a.codiceFiscale || '').trim().toUpperCase()));
                    const validItems = [];

                    for (const atleta of importPreview) {
                        const cf = atleta.codiceFiscale;
                        if (existingCFs.has(cf)) {
                            duplicateCount++;
                            continue;
                        }
                        validItems.push(atleta);
                        existingCFs.add(cf);
                    }

                    const chunks = [];
                    for (let i = 0; i < validItems.length; i += 40) {
                        chunks.push(validItems.slice(i, i + 40));
                    }

                    for (const chunk of chunks) {
                        const batch = writeBatch(db);
                        for (const atleta of chunk) {
                            const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'));
                            batch.set(newDocRef, {
                                ...atleta,
                                createdAt: new Date().toISOString()
                            });
                        }
                        await batch.commit();
                        successCount += chunk.length;
                    }

                    if (duplicateCount > 0) {
                        alert(`Rilevate ${duplicateCount} atlete già presenti in archivio ("Atleta già inserita"). Saltate per evitare duplicati.`);
                    }

                    showToast(`Importate con successo ${successCount} atlete!`);
                    setImportModalOpen(false);
                    setImportPreview([]);
                } catch (err) {
                    console.error("Errore importazione batch:", err);
                    showToast("Errore durante l'importazione", "error");
                } finally {
                    setImporting(false);
                }
            };

            const filteredAtlete = useMemo(() => {
                return atlete.filter(a => {
                    const matchSearch = (a.cognomeNome || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.codiceFiscale || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.societaAppartenenza || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.numeroDocumento || '').toLowerCase().includes(searchTerm.toLowerCase());
                    
                    const matchCat = selectedCategory === 'TUTTE' || 
                                     (a.categoria || '') === selectedCategory || 
                                     (a.secondaCategoria || '') === selectedCategory;

                    return matchSearch && matchCat;
                });
            }, [atlete, searchTerm, selectedCategory]);

            // Schermata di Login completamente pulita e verificata su Firebase
            if (!user) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl border border-slate-800">
                            <div className="text-center mb-6">
                                <h1 className="text-xl font-bold tracking-wider text-red-700">ASD MONTERONI VOLLEY</h1>
                                <p className="text-xs text-slate-500 mt-1">Area Riservata Dirigenza</p>
                            </div>

                            {loginError && (
                                <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium text-center">
                                    {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Utente</label>
                                    <input 
                                        type="text" 
                                        required 
                                        value={loginUser}
                                        onChange={e => setLoginUser(e.target.value)}
                                        placeholder="Inserisci username"
                                        className="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 lowercase"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        required 
                                        value={loginPass}
                                        onChange={e => setLoginPass(e.target.value)}
                                        placeholder="Inserisci password"
                                        className="w-full p-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500"
                                    />
                                </div>
                                <button type="submit" className="w-full py-3 bg-red-700 hover:bg-red-800 text-white rounded-lg font-semibold shadow transition text-sm">
                                    Accedi al Gestionale
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {toast && (
                        <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            {toast.message}
                        </div>
                    )}

                    <header className="bg-red-700 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="Logo ASD Monteroni Volley" className="w-12 h-12 object-contain bg-white rounded-full p-1 shadow" />
                                <div>
                                    <h1 className="text-xl font-bold tracking-wider">ASD MONTERONI VOLLEY</h1>
                                    <p className="text-xs text-red-100">Benvenuto, <span className="font-semibold uppercase">{user}</span></p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 items-center">
                                <button onClick={() => setChangePassModal(true)} className="bg-red-800 hover:bg-red-900 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center gap-2 border border-red-600 transition">
                                    🔑 Cambia Password
                                </button>
                                <button onClick={handleLogout} className="bg-slate-800 hover:bg-slate-900 text-red-300 px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center gap-2 border border-slate-700 transition">
                                    🚪 Esci
                                </button>
                                <label className="cursor-pointer bg-white text-red-700 hover:bg-red-50 font-semibold px-3 py-2 rounded-lg shadow text-xs sm:text-sm flex items-center gap-2 transition">
                                    📁 Importa Excel / CSV
                                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <button onClick={() => { resetForm(); setModalOpen(true); }} className="bg-red-800 hover:bg-red-900 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center gap-2 border border-red-600 transition">
                                    ➕ Nuova Atleta
                                </button>
                                {atlete.length > 0 && (
                                    <button onClick={handleClearDatabase} className="bg-slate-800 hover:bg-slate-900 text-red-400 px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center gap-2 border border-slate-700 transition" title="Elimina tutte le atlete dal database">
                                        🗑️ Svuota Archivio
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
                            <div className="relative w-full md:w-96">
                                <input 
                                    type="text" 
                                    placeholder="🔍 Cerca per cognome, nome, CF, doc, società..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 text-sm"
                                />
                            </div>
                            <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                <button 
                                    onClick={() => setSelectedCategory('TUTTE')}
                                    className={`px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap ${selectedCategory === 'TUTTE' ? 'bg-red-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                >
                                    Tutte ({atlete.length})
                                </button>
                                {CATEGORIES.filter(c => c !== '').map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap ${selectedCategory === cat ? 'bg-red-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                            {loading ? (
                                <div className="p-12 text-center text-slate-500">Caricamento archivio cloud in corso...</div>
                            ) : filteredAtlete.length === 0 ? (
                                <div className="p-12 text-center text-slate-500">Nessuna atleta trovata in archivio.</div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[1000px]">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                                <th className="p-3">Matr.</th>
                                                <th className="p-3">Maglia</th>
                                                <th className="p-3">Cognome e Nome</th>
                                                <th className="p-3">Codice Fiscale</th>
                                                <th className="p-3">Documento</th>
                                                <th className="p-3">Categoria</th>
                                                <th className="p-3">Società Appartenenza</th>
                                                <th className="p-3">Certificato</th>
                                                <th className="p-3">Quota</th>
                                                <th className="p-3 text-right">Azioni</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 text-sm">
                                            {filteredAtlete.map(atleta => {
                                                const certStatus = getCertStatus(atleta.dataCertificato);
                                                let certBadgeStyle = 'bg-emerald-100 text-emerald-800'; 
                                                if (certStatus === 'red') certBadgeStyle = 'bg-red-100 text-red-800';
                                                else if (certStatus === 'yellow') certBadgeStyle = 'bg-amber-100 text-amber-800'; 

                                                const catStyle = CATEGORY_COLORS[atleta.categoria] || CATEGORY_COLORS[''];

                                                return (
                                                    <tr key={atleta.id} className="hover:bg-slate-50 transition">
                                                        <td className="p-3 font-mono text-xs text-slate-500">{atleta.matricola || '-'}</td>
                                                        <td className="p-3 font-bold text-red-700">{atleta.numeroMaglia || 'Non assegnato'}</td>
                                                        <td className="p-3 font-semibold text-slate-900">{atleta.cognomeNome}</td>
                                                        <td className="p-3 font-mono text-xs text-slate-600">{atleta.codiceFiscale}</td>
                                                        <td className="p-3 text-slate-600">
                                                            {atleta.tipoDocumento ? (
                                                                <div className="text-xs">
                                                                    <span className="font-medium text-slate-700">{atleta.tipoDocumento}</span>
                                                                    <div className="font-mono text-slate-500">{atleta.numeroDocumento || 'N/D'}</div>
                                                                </div>
                                                            ) : '-'}
                                                        </td>
                                                        <td className="p-3">
                                                            <span className={`px-2 py-0.5 rounded font-semibold text-xs border ${catStyle}`}>
                                                                {atleta.categoria || 'Non assegnata'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-slate-700 font-medium">{atleta.societaAppartenenza}</td>
                                                        <td className="p-3 text-slate-600">
                                                            <span className={`px-2 py-0.5 rounded text-xs font-semibold ${certBadgeStyle}`}>
                                                                {formatDateDisplay(atleta.dataCertificato)}
                                                            </span>
                                                        </td>
                                                        <td className="p-3">
                                                            <span className={`px-2 py-0.5 rounded text-xs font-semibold ${atleta.quotaIscrizione === 'PAGATO' ? 'bg-green-100 text-green-800' : atleta.quotaIscrizione === 'DA PAGARE' ? 'bg-orange-100 text-orange-800' : 'bg-slate-100 text-slate-500'}`}>
                                                                {atleta.quotaIscrizione || 'Non specificato'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-right">
                                                            <div className="flex justify-end gap-1.5">
                                                                <button onClick={() => { setCurrentAtleta(atleta); setFormData(atleta); setModalOpen(true); }} className="p-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded transition" title="Modifica">
                                                                    ✏️
                                                                </button>
                                                                <button onClick={() => handleDelete(atleta.id)} className="p-1.5 hover:bg-red-100 rounded text-red-600 transition" title="Elimina">
                                                                    🗑️
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Modale Cambio Password */}
                    {changePassModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-950">Cambia Password ({user})</h3>
                                    <button onClick={() => setChangePassModal(false)} className="p-1 hover:bg-slate-100 rounded-full font-bold">✕</button>
                                </div>
                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nuova Password</label>
                                        <input 
                                            type="password" 
                                            required 
                                            value={newPass}
                                            onChange={e => setNewPass(e.target.value)}
                                            placeholder="Inserisci nuova password"
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500"
                                        />
                                    </div>
                                    <div className="flex justify-end gap-3 pt-2 border-t">
                                        <button type="button" onClick={() => setChangePassModal(false)} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                                        <button type="submit" className="px-5 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg text-sm font-semibold shadow">Salva Password</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modale Inserimento / Modifica Totale Atleta */}
                    {modalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-950">{currentAtleta ? 'Modifica Atleta' : 'Nuova Atleta'}</h3>
                                    <button onClick={() => setModalOpen(false)} className="p-1 hover:bg-slate-100 rounded-full font-bold">✕</button>
                                </div>
                                <form onSubmit={handleSave} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Cognome e Nome</label>
                                        <input 
                                            type="text" 
                                            required 
                                            value={formData.cognomeNome}
                                            onChange={e => setFormData({...formData, cognomeNome: e.target.value})}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Matricola</label>
                                            <input 
                                                type="text" 
                                                value={formData.matricola}
                                                onChange={e => setFormData({...formData, matricola: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">N. Maglia</label>
                                            <input 
                                                type="text" 
                                                value={formData.numeroMaglia}
                                                onChange={e => setFormData({...formData, numeroMaglia: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm font-bold text-red-700"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Anno</label>
                                            <input 
                                                type="text" 
                                                value={formData.anno}
                                                onChange={e => setFormData({...formData, anno: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Codice Fiscale</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={formData.codiceFiscale}
                                                onChange={e => setFormData({...formData, codiceFiscale: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Nascita</label>
                                            <input 
                                                type="date" 
                                                value={formData.dataNascita}
                                                onChange={e => setFormData({...formData, dataNascita: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoria Principale</label>
                                            <select 
                                                value={formData.categoria}
                                                onChange={e => setFormData({...formData, categoria: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                <option value="">Seleziona...</option>
                                                {CATEGORIES.filter(c => c !== '').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Seconda Categoria</label>
                                            <select 
                                                value={formData.secondaCategoria}
                                                onChange={e => setFormData({...formData, secondaCategoria: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                <option value="">Nessuna</option>
                                                {CATEGORIES.filter(c => c !== '').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipo Documento</label>
                                            <select 
                                                value={formData.tipoDocumento}
                                                onChange={e => setFormData({...formData, tipoDocumento: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                <option value="">Seleziona tipo...</option>
                                                {DOC_TYPES.filter(d => d !== '').map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">N. Documento</label>
                                            <input 
                                                type="text" 
                                                value={formData.numeroDocumento}
                                                onChange={e => setFormData({...formData, numeroDocumento: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"
                                                placeholder="Es. AB12345CD"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Quota Iscrizione</label>
                                            <select 
                                                value={formData.quotaIscrizione}
                                                onChange={e => setFormData({...formData, quotaIscrizione: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                <option value="">Seleziona stato quota...</option>
                                                {PAYMENT_STATUSES.filter(p => p !== '').map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Certificato Medico</label>
                                            <input 
                                                type="date" 
                                                value={formData.dataCertificato}
                                                onChange={e => setFormData({...formData, dataCertificato: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Società Appartenenza (Prestiti)</label>
                                        <input 
                                            type="text" 
                                            value={formData.societaAppartenenza}
                                            onChange={e => setFormData({...formData, societaAppartenenza: e.target.value})}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>
                                    <div className="flex justify-end gap-3 pt-4 border-t">
                                        <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                                        <button type="submit" className="px-5 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg text-sm font-semibold shadow">Salva Atleta</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {importModalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-xl max-h-[90vh] flex flex-col">
                                <h3 className="text-lg font-bold text-slate-950 mb-2">Anteprima Importazione ({importPreview.length} Atlete Rilevate)</h3>
                                <p className="text-xs text-slate-500 mb-4">Verifica i dati estratti dal file prima di procedere al salvataggio nel cloud.</p>
                                
                                <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl mb-4">
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead className="bg-slate-50 sticky top-0 border-b">
                                            <tr>
                                                <th className="p-2.5">Nome e Cognome</th>
                                                <th className="p-2.5">CF</th>
                                                <th className="p-2.5">Nascita</th>
                                                <th className="p-2.5">Società</th>
                                                <th className="p-2.5">Certificato</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {importPreview.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-2.5 font-bold">{item.cognomeNome}</td>
                                                    <td className="p-2.5 font-mono">{item.codiceFiscale}</td>
                                                    <td className="p-2.5">{item.dataNascita}</td>
                                                    <td className="p-2.5">{item.societaAppartenenza}</td>
                                                    <td className="p-2.5">{item.dataCertificato}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex justify-end gap-3 pt-2 border-t">
                                    <button onClick={() => setImportModalOpen(false)} disabled={importing} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                                    <button onClick={confirmImport} disabled={importing} className="px-6 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-sm font-semibold shadow flex items-center gap-2">
                                        {importing ? 'Salvataggio in corso...' : 'Conferma e Salva in Archivio'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        try {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } catch (err) {
            console.error("Errore fatale rendering React:", err);
            document.getElementById('root').innerHTML = '<div style="padding: 40px; color: red; text-align: center;"><h3>Errore di caricamento applicazione.</h3><p>' + err.message + '</p></div>';
        }
    </script>
</body>
</html>
