<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel (.xlsx) support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Firebase SDKs as UMD globals -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Setup Firebase safely with compat libraries
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
          apiKey: "demo-api-key",
          authDomain: "demo-app.firebaseapp.com",
          projectId: "demo-app",
          storageBucket: "demo-app.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pallavolo-atlete-app';

        const CATEGORIES = ['B2', '1D', 'U19', 'U17', 'U15', 'U13'];
        const PAYMENT_STATUSES = ['NON DOVUTO', 'DA PAGARE', 'PAGATO'];

        // Componente Logo Vettoriale ASD Monteroni Volley
        function MonteroniLogo({ className = "w-10 h-10" }) {
          return (
            <svg className={className} viewBox="0 0 400 450" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(100, 10) scale(0.5)">
                <circle cx="200" cy="150" r="120" fill="white" stroke="#B81D24" strokeWidth="16"/>
                <path d="M 200 30 C 230 80, 230 140, 200 270" stroke="#B81D24" strokeWidth="14" fill="none" />
                <path d="M 110 80 C 180 120, 220 180, 290 220" stroke="#B81D24" strokeWidth="14" fill="none" />
                <path d="M 290 80 C 220 120, 180 180, 110 220" stroke="#B81D24" strokeWidth="14" fill="none" />
              </g>
              
              <path 
                d="M 60 120 Q 200 70 340 120 Q 380 260 200 420 Q 20 260 60 120 Z" 
                fill="#B81D24" 
                stroke="white" 
                strokeWidth="10"
              />
              
              <path 
                d="M 75 132 Q 200 88 325 132 Q 360 255 200 400 Q 40 255 75 132 Z" 
                fill="white" 
              />

              <path 
                d="M 82 340 Q 130 280 170 330 Q 200 270 230 330 Q 270 290 318 340 L 318 350 Q 200 400 200 400 Z" 
                fill="#B81D24" 
              />

              <text x="200" y="210" textAnchor="middle" fill="#B81D24" fontFamily="Impact, sans-serif" fontSize="42" fontWeight="900" letterSpacing="1">
                MONTERONI
              </text>
              <text x="200" y="250" textAnchor="middle" fill="#B81D24" fontFamily="Impact, sans-serif" fontSize="34" fontWeight="bold" letterSpacing="2">
                VOLLEY
              </text>

              <g fill="#B81D24" transform="translate(160, 265)">
                <polygon points="10,0 13,7 20,7 14,11 16,18 10,13 4,18 6,11 0,7 7,7"/>
              </g>
              <g fill="#B81D24" transform="translate(220, 265)">
                <polygon points="10,0 13,7 20,7 14,11 16,18 10,13 4,18 6,11 0,7 7,7"/>
              </g>

              <path d="M 120 300 Q 100 240 80 210 Q 110 230 130 290 Z" fill="#B81D24" />
              <path d="M 100 250 L 85 240 M 105 260 L 90 253 M 110 270 L 95 265" stroke="#B81D24" strokeWidth="4"/>

              <circle cx="280" cy="270" r="28" fill="#B81D24" />
              <rect x="275" y="295" width="10" height="25" fill="#B81D24" />

              <text x="200" y="380" textAnchor="middle" fill="white" fontFamily="Arial, sans-serif" fontSize="28" fontWeight="bold">
                ASD
              </text>
            </svg>
          );
        }

        function App() {
          const [user, setUser] = useState(null);
          const [atlete, setAtlete] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);

          const [activeTab, setActiveTab] = useState('ALL');
          const [searchQuery, setSearchQuery] = useState('');
          const [certFilter, setCertFilter] = useState('ALL');
          const [paymentFilter, setPaymentFilter] = useState('ALL');

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [isImportModalOpen, setIsImportModalOpen] = useState(false);
          const [isInstallModalOpen, setIsInstallModalOpen] = useState(false);
          const [currentAthlete, setCurrentAthlete] = useState(null);
          const [deleteConfirmId, setDeleteConfirmId] = useState(null);

          const [importRows, setImportRows] = useState([]);
          const [importing, setImporting] = useState(false);

          const [formData, setFormData] = useState({
            nome: '',
            cognome: '',
            codiceFiscale: '',
            dataNascita: '',
            categorie: [],
            scadenzaCertificato: '',
            pagamentoRata1: 'NON DOVUTO',
            pagamentoRata2: 'NON DOVUTO',
            note: ''
          });

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                  await auth.signInAnonymously();
                }
              } catch (err) {
                console.error("Auth Error:", err);
                setError("Errore nella connessione al server di autenticazione.");
              }
            };
            initAuth();
            const unsubscribe = auth.onAuthStateChanged((u) => {
              setUser(u);
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;

            setLoading(true);
            const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
            
            const unsubscribe = atleteRef.onSnapshot(
              (snapshot) => {
                const list = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setAtlete(list);
                setLoading(false);
              },
              (err) => {
                console.error("Firestore Error:", err);
                setError("Impossibile caricare i dati delle atlete.");
                setLoading(false);
              }
            );

            return () => unsubscribe();
          }, [user]);

          const getCertStatus = (dateString) => {
            if (!dateString) return { status: 'UNKNOWN', label: 'Non Inserito', color: 'bg-slate-100 text-slate-700 border-slate-300' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const certDate = new Date(dateString);
            certDate.setHours(0, 0, 0, 0);

            const diffDays = Math.ceil((certDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
              return { status: 'EXPIRED', label: 'Scaduto', color: 'bg-red-100 text-red-700 border-red-300 shadow-sm font-bold', days: Math.abs(diffDays) };
            } else if (diffDays <= 30) {
              return { status: 'EXPIRING', label: `In Scadenza (${diffDays} gg)`, color: 'bg-amber-100 text-amber-800 border-amber-300 shadow-sm font-semibold', days: diffDays };
            } else {
              return { status: 'VALID', label: 'Valido', color: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-medium', days: diffDays };
            }
          };

          const getPaymentBadge = (status) => {
            const st = status || 'NON DOVUTO';
            switch (st) {
              case 'PAGATO':
                return { label: 'PAGATO', color: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-semibold' };
              case 'DA PAGARE':
                return { label: 'DA PAGARE', color: 'bg-red-100 text-red-800 border-red-300 font-bold' };
              case 'NON DOVUTO':
              default:
                return { label: 'NON DOVUTO', color: 'bg-slate-100 text-slate-500 border-slate-200' };
            }
          };

          const handleOpenModal = (athlete = null) => {
            if (athlete) {
              setCurrentAthlete(athlete);
              setFormData({
                nome: athlete.nome || '',
                cognome: athlete.cognome || '',
                codiceFiscale: athlete.codiceFiscale || '',
                dataNascita: athlete.dataNascita || '',
                categorie: athlete.categorie || [],
                scadenzaCertificato: athlete.scadenzaCertificato || '',
                pagamentoRata1: athlete.pagamentoRata1 || 'NON DOVUTO',
                pagamentoRata2: athlete.pagamentoRata2 || 'NON DOVUTO',
                note: athlete.note || ''
              });
            } else {
              setCurrentAthlete(null);
              setFormData({
                nome: '',
                cognome: '',
                codiceFiscale: '',
                dataNascita: '',
                categorie: activeTab !== 'ALL' ? [activeTab] : [],
                scadenzaCertificato: '',
                pagamentoRata1: 'NON DOVUTO',
                pagamentoRata2: 'NON DOVUTO',
                note: ''
              });
            }
            setIsModalOpen(true);
          };

          const handleCategoryToggle = (cat) => {
            setFormData(prev => {
              const exists = prev.categorie.includes(cat);
              if (exists) {
                return { ...prev, categorie: prev.categorie.filter(c => c !== cat) };
              } else {
                return { ...prev, categorie: [...prev.categorie, cat] };
              }
            });
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (!formData.nome || !formData.cognome) {
              alert("Nome e Cognome sono obbligatori.");
              return;
            }

            try {
              const dataToSave = {
                ...formData,
                codiceFiscale: formData.codiceFiscale.toUpperCase().trim(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              };

              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');

              if (currentAthlete) {
                await atleteRef.doc(currentAthlete.id).update(dataToSave);
              } else {
                await atleteRef.add({
                  ...dataToSave,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
              setIsModalOpen(false);
            } catch (err) {
              console.error("Errore salvataggio:", err);
              alert("Si è verificato un errore durante il salvataggio dei dati.");
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
              reader.onload = (event) => {
                try {
                  const data = new Uint8Array(event.target.result);
                  const workbook = XLSX.read(data, { type: 'array' });
                  const firstSheetName = workbook.SheetNames[0];
                  const worksheet = workbook.Sheets[firstSheetName];
                  const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                  
                  const dataRows = rows.slice(5);

                  const parsedData = dataRows.map((cols) => {
                    if (!cols || cols.length === 0) return null;
                    const cognome = (cols[0] || '').toString().trim();
                    const nome = (cols[1] || '').toString().trim();
                    if (!nome && !cognome) return null;

                    const codiceFiscale = (cols[2] || '').toString().toUpperCase().trim();
                    const dataNascita = (cols[3] || '').toString().trim();
                    const catRaw = (cols[4] || '').toString().trim();
                    const certDate = (cols[5] || '').toString().trim();
                    const r1 = (cols[6] || '').toString().toUpperCase().trim();
                    const r2 = (cols[7] || '').toString().toUpperCase().trim();

                    const categorie = catRaw ? catRaw.split(/[\s,/]+/).filter(c => CATEGORIES.includes(c.toUpperCase())) : [];

                    let pagamentoRata1 = 'NON DOVUTO';
                    if (r1.includes('PAGAT') || r1 === 'OK' || r1 === 'SI') pagamentoRata1 = 'PAGATO';
                    else if (r1.includes('DA PAG') || r1 === 'NO') pagamentoRata1 = 'DA PAGARE';

                    let pagamentoRata2 = 'NON DOVUTO';
                    if (r2.includes('PAGAT') || r2 === 'OK' || r2 === 'SI') pagamentoRata2 = 'PAGATO';
                    else if (r2.includes('DA PAG') || r2 === 'NO') pagamentoRata2 = 'DA PAGARE';

                    return {
                      cognome,
                      nome,
                      codiceFiscale,
                      dataNascita,
                      categorie: categorie.length > 0 ? categorie : (activeTab !== 'ALL' ? [activeTab] : []),
                      scadenzaCertificato: certDate,
                      pagamentoRata1,
                      pagamentoRata2,
                      note: (cols[8] || '').toString().trim()
                    };
                  }).filter(Boolean);

                  setImportRows(parsedData);
                  setIsImportModalOpen(true);
                } catch (err) {
                  console.error("Errore lettura Excel:", err);
                  alert("Errore nella lettura del file Excel.");
                }
              };
              reader.readAsArrayBuffer(file);
            } else {
              reader.onload = (event) => {
                const text = event.target.result;
                const lines = text.split(/\r\n|\n/);
                const dataLines = lines.slice(5).filter(line => line.trim().length > 0);

                const parsedData = dataLines.map((line) => {
                  const delimiter = line.includes(';') ? ';' : ',';
                  const cols = line.split(delimiter).map(c => c.trim().replace(/^"(.*)"$/, '$1'));

                  const cognome = cols[0] || '';
                  const nome = cols[1] || '';
                  if (!nome && !cognome) return null;

                  const codiceFiscale = (cols[2] || '').toUpperCase();
                  const dataNascita = cols[3] || '';
                  const catRaw = cols[4] || '';
                  const certDate = cols[5] || '';
                  const r1 = (cols[6] || '').toUpperCase();
                  const r2 = (cols[7] || '').toUpperCase();

                  const categorie = catRaw ? catRaw.split(/[\s,/]+/).filter(c => CATEGORIES.includes(c.toUpperCase())) : [];

                  let pagamentoRata1 = 'NON DOVUTO';
                  if (r1.includes('PAGAT') || r1 === 'OK' || r1 === 'SI') pagamentoRata1 = 'PAGATO';
                  else if (r1.includes('DA PAG') || r1 === 'NO') pagamentoRata1 = 'DA PAGARE';

                  let pagamentoRata2 = 'NON DOVUTO';
                  if (r2.includes('PAGAT') || r2 === 'OK' || r2 === 'SI') pagamentoRata2 = 'PAGATO';
                  else if (r2.includes('DA PAG') || r2 === 'NO') pagamentoRata2 = 'DA PAGARE';

                  return {
                    cognome,
                    nome,
                    codiceFiscale,
                    dataNascita,
                    categorie: categorie.length > 0 ? categorie : (activeTab !== 'ALL' ? [activeTab] : []),
                    scadenzaCertificato: certDate,
                    pagamentoRata1,
                    pagamentoRata2,
                    note: cols[8] || ''
                  };
                }).filter(Boolean);

                setImportRows(parsedData);
                setIsImportModalOpen(true);
              };
              reader.readAsText(file);
            }
            e.target.value = null;
          };

          const handleConfirmImport = async () => {
            if (importRows.length === 0) return;
            setImporting(true);

            try {
              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
              for (const item of importRows) {
                await atleteRef.add({
                  ...item,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
              setIsImportModalOpen(false);
              setImportRows([]);
              alert(`Importate con successo ${importRows.length} atlete!`);
            } catch (err) {
              console.error("Errore importazione:", err);
              alert("Si è verificato un errore durante l'importazione.");
            } finally {
              setImporting(false);
            }
          };

          const handleDelete = async (id) => {
            try {
              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
              await atleteRef.doc(id).delete();
              setDeleteConfirmId(null);
            } catch (err) {
              console.error("Errore eliminazione:", err);
              alert("Errore durante l'eliminazione dell'atleta.");
            }
          };

          const filteredAtlete = useMemo(() => {
            return atlete.filter(item => {
              const searchLower = searchQuery.toLowerCase();
              const matchesSearch = 
                !searchQuery ||
                (item.nome && item.nome.toLowerCase().includes(searchLower)) ||
                (item.cognome && item.cognome.toLowerCase().includes(searchLower)) ||
                (item.codiceFiscale && item.codiceFiscale.toLowerCase().includes(searchLower));

              const matchesTab = activeTab === 'ALL' || (item.categorie && item.categorie.includes(activeTab));

              const certInfo = getCertStatus(item.scadenzaCertificato);
              let matchesCert = true;
              if (certFilter === 'EXPIRED') matchesCert = certInfo.status === 'EXPIRED';
              if (certFilter === 'EXPIRING') matchesCert = certInfo.status === 'EXPIRING';
              if (certFilter === 'VALID') matchesCert = certInfo.status === 'VALID';
              if (certFilter === 'PROBLEMATIC') matchesCert = certInfo.status === 'EXPIRED' || certInfo.status === 'EXPIRING';

              let matchesPayment = true;
              const r1 = item.pagamentoRata1 || 'NON DOVUTO';
              const r2 = item.pagamentoRata2 || 'NON DOVUTO';

              if (paymentFilter === 'PENDING_1') matchesPayment = r1 === 'DA PAGARE';
              if (paymentFilter === 'PENDING_2') matchesPayment = r2 === 'DA PAGARE';
              if (paymentFilter === 'PENDING_ANY') matchesPayment = r1 === 'DA PAGARE' || r2 === 'DA PAGARE';

              return matchesSearch && matchesTab && matchesCert && matchesPayment;
            });
          }, [atlete, searchQuery, activeTab, certFilter, paymentFilter]);

          const stats = useMemo(() => {
            let expired = 0;
            let expiring = 0;
            let pendingPayments = 0;

            atlete.forEach(item => {
              const status = getCertStatus(item.scadenzaCertificato).status;
              if (status === 'EXPIRED') expired++;
              if (status === 'EXPIRING') expiring++;

              if (item.pagamentoRata1 === 'DA PAGARE' || item.pagamentoRata2 === 'DA PAGARE') {
                pendingPayments++;
              }
            });

            return { total: atlete.length, expired, expiring, pendingPayments };
          }, [atlete]);

          const exportCSV = () => {
            if (atlete.length === 0) return;

            const headers = ["Cognome", "Nome", "Codice Fiscale", "Data Nascita", "Categorie", "Scadenza Certificato", "I Rata", "II Rata", "Note"];
            const rows = filteredAtlete.map(a => [
              `"${a.cognome || ''}"`,
              `"${a.nome || ''}"`,
              `"${a.codiceFiscale || ''}"`,
              `"${a.dataNascita || ''}"`,
              `"${(a.categorie || []).join(', ')}"`,
              `"${a.scadenzaCertificato || ''}"`,
              `"${a.pagamentoRata1 || 'NON DOVUTO'}"`,
              `"${a.pagamentoRata2 || 'NON DOVUTO'}"`,
              `"${(a.note || '').replace(/"/g, '""')}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `atlete_pallavolo_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans pb-12">
              <header className="bg-gradient-to-r from-red-800 via-[#B81D24] to-red-900 text-white shadow-md sticky top-0 z-20">
                <div className="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="p-1.5 bg-white rounded-2xl shadow-md">
                      <MonteroniLogo className="w-9 h-10" />
                    </div>
                    <div>
                      <h1 className="text-lg sm:text-xl font-bold tracking-tight text-white">ASD Monteroni Volley Manager</h1>
                      <p className="text-xs text-red-100">Database Condiviso Atlete</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setIsInstallModalOpen(true)}
                      className="flex items-center space-x-1.5 bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all"
                    >
                      <i data-lucide="smartphone" className="w-4 h-4 text-amber-300"></i>
                      <span className="hidden sm:inline">Installa App</span>
                    </button>

                    <button
                      onClick={() => handleOpenModal()}
                      className="flex items-center space-x-1.5 bg-white hover:bg-red-50 text-red-700 px-3.5 py-2 rounded-xl font-bold shadow-lg shadow-black/10 active:scale-95 transition-all text-xs sm:text-sm"
                    >
                      <i data-lucide="user-plus" className="w-4 h-4 text-red-700"></i>
                      <span className="hidden sm:inline">Nuova Atleta</span>
                      <span className="sm:hidden">Nuova</span>
                    </button>
                  </div>
                </div>

                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto no-scrollbar space-x-1 pt-1">
                  <button
                    onClick={() => setActiveTab('ALL')}
                    className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-t-xl transition-all flex-shrink-0 flex items-center space-x-2 ${
                      activeTab === 'ALL'
                        ? 'bg-slate-50 text-red-800 border-t-2 border-red-500 font-bold'
                        : 'text-red-100 hover:bg-white/10'
                    }`}
                  >
                    <span>Tutte le Atlete</span>
                    <span className="bg-red-900/50 text-red-100 px-2 py-0.5 rounded-full text-[10px]">
                      {atlete.length}
                    </span>
                  </button>
                  {CATEGORIES.map(cat => {
                    const count = atlete.filter(a => a.categorie && a.categorie.includes(cat)).length;
                    return (
                      <button
                        key={cat}
                        onClick={() => setActiveTab(cat)}
                        className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-t-xl transition-all flex-shrink-0 flex items-center space-x-2 ${
                          activeTab === cat
                            ? 'bg-slate-50 text-red-800 border-t-2 border-red-500 font-bold'
                            : 'text-red-100 hover:bg-white/10'
                        }`}
                      >
                        <span>{cat}</span>
                        <span className="bg-red-900/50 text-red-100 px-2 py-0.5 rounded-full text-[10px]">
                          {count}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div className="p-3 bg-red-50 text-red-700 rounded-xl">
                      <i data-lucide="users" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Totale Atlete</p>
                      <p className="text-xl sm:text-2xl font-bold text-slate-900">{stats.total}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div className="p-3 bg-red-100 text-red-700 rounded-xl">
                      <i data-lucide="x-circle" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Cert. Scaduti</p>
                      <p className="text-xl sm:text-2xl font-bold text-red-600">{stats.expired}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div className="p-3 bg-amber-50 text-amber-700 rounded-xl">
                      <i data-lucide="alert-triangle" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">In Scadenza (30g)</p>
                      <p className="text-xl sm:text-2xl font-bold text-amber-600">{stats.expiring}</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex items-center space-x-3">
                    <div className="p-3 bg-rose-50 text-rose-700 rounded-xl">
                      <i data-lucide="credit-card" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-500 font-medium">Rate Sospese</p>
                      <p className="text-xl sm:text-2xl font-bold text-rose-600">{stats.pendingPayments}</p>
                    </div>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div className="relative flex-1">
                      <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                      <input
                        type="text"
                        placeholder="Cerca per Nome, Cognome o Codice Fiscale..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:bg-white transition-all"
                      />
                      {searchQuery && (
                        <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                          <i data-lucide="x" className="w-4 h-4"></i>
                        </button>
                      )}
                    </div>

                    <div className="flex items-center space-x-2">
                      <label className="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer transition-all">
                        <i data-lucide="upload" className="w-4 h-4 text-slate-600"></i>
                        <span>Importa Excel / CSV</span>
                        <input type="file" accept=".xlsx, .xls, .csv, .txt" onChange={handleFileUpload} className="hidden" />
                      </label>

                      <button
                        onClick={exportCSV}
                        className="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all"
                      >
                        <i data-lucide="download" className="w-4 h-4 text-slate-600"></i>
                        <span>Esporta CSV</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 text-xs">
                    <span className="font-semibold text-slate-500 flex items-center mr-1">
                      <i data-lucide="filter" className="w-3.5 h-3.5 mr-1"></i> Filtri:
                    </span>

                    <select
                      value={certFilter}
                      onChange={(e) => setCertFilter(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium focus:ring-2 focus:ring-red-600 outline-none"
                    >
                      <option value="ALL">Certificati: Tutti</option>
                      <option value="EXPIRED">🔴 Solo Scaduti</option>
                      <option value="EXPIRING">🟠 Solo In Scadenza (30 gg)</option>
                      <option value="PROBLEMATIC">⚠️ Scaduti o In Scadenza</option>
                      <option value="VALID">🟢 Solo Validi</option>
                    </select>

                    <select
                      value={paymentFilter}
                      onChange={(e) => setPaymentFilter(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium focus:ring-2 focus:ring-red-600 outline-none"
                    >
                      <option value="ALL">Pagamenti: Tutti</option>
                      <option value="PENDING_1">I Rata DA PAGARE</option>
                      <option value="PENDING_2">II Rata DA PAGARE</option>
                      <option value="PENDING_ANY">Almeno una rata DA PAGARE</option>
                    </select>

                    {(certFilter !== 'ALL' || paymentFilter !== 'ALL' || searchQuery !== '') && (
                      <button
                        onClick={() => {
                          setCertFilter('ALL');
                          setPaymentFilter('ALL');
                          setSearchQuery('');
                        }}
                        className="text-red-700 font-semibold hover:underline ml-auto"
                      >
                        Resetta Filtri
                      </button>
                    )}
                  </div>
                </div>

                {loading ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
                    <i data-lucide="refresh-cw" className="w-8 h-8 text-red-600 animate-spin mx-auto mb-3"></i>
                    <p className="text-slate-500 text-sm font-medium">Sincronizzazione dati dal cloud...</p>
                  </div>
                ) : filteredAtlete.length === 0 ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
                    <i data-lucide="users" className="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                    <h3 className="text-base font-bold text-slate-700">Nessuna Atleta Trovata</h3>
                    <p className="text-xs text-slate-500 mt-1">Nessun elemento risponde ai criteri di ricerca selezionati.</p>
                  </div>
                ) : (
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="hidden lg:block overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-100/80 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-wider">
                          <tr>
                            <th className="py-3 px-4">Atleta</th>
                            <th className="py-3 px-4">Codice Fiscale</th>
                            <th className="py-3 px-4">Nascita</th>
                            <th className="py-3 px-4">Categorie</th>
                            <th className="py-3 px-4">Certificato Medico</th>
                            <th className="py-3 px-4 text-center">I Rata</th>
                            <th className="py-3 px-4 text-center">II Rata</th>
                            <th className="py-3 px-4 text-right">Azioni</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredAtlete.map((athlete) => {
                            const certStatus = getCertStatus(athlete.scadenzaCertificato);
                            const r1Badge = getPaymentBadge(athlete.pagamentoRata1);
                            const r2Badge = getPaymentBadge(athlete.pagamentoRata2);

                            return (
                              <tr key={athlete.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-3.5 px-4 font-bold text-slate-900">
                                  {athlete.cognome} {athlete.nome}
                                  {athlete.note && (
                                    <p className="text-[11px] font-normal text-slate-400 italic mt-0.5 truncate max-w-xs">
                                      {athlete.note}
                                    </p>
                                  )}
                                </td>
                                <td className="py-3.5 px-4 font-mono text-slate-600">{athlete.codiceFiscale || '-'}</td>
                                <td className="py-3.5 px-4 text-slate-600">{athlete.dataNascita || '-'}</td>
                                <td className="py-3.5 px-4">
                                  <div className="flex flex-wrap gap-1">
                                    {(athlete.categorie || []).map(cat => (
                                      <span key={cat} className="bg-red-50 text-red-800 border border-red-200 px-2 py-0.5 rounded-md font-bold text-[10px]">
                                        {cat}
                                      </span>
                                    ))}
                                  </div>
                                </td>
                                <td className="py-3.5 px-4">
                                  <span className={`inline-flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] border ${certStatus.color}`}>
                                    {certStatus.status === 'EXPIRED' && <i data-lucide="x-circle" className="w-3.5 h-3.5 text-red-600"></i>}
                                    {certStatus.status === 'EXPIRING' && <i data-lucide="alert-triangle" className="w-3.5 h-3.5 text-amber-600"></i>}
                                    {certStatus.status === 'VALID' && <i data-lucide="check-circle" className="w-3.5 h-3.5 text-emerald-600"></i>}
                                    <span>{athlete.scadenzaCertificato ? athlete.scadenzaCertificato : 'Mancante'}</span>
                                    <span className="opacity-75">({certStatus.label})</span>
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <span className={`px-2.5 py-1 rounded-md text-[10px] border ${r1Badge.color}`}>
                                    {r1Badge.label}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <span className={`px-2.5 py-1 rounded-md text-[10px] border ${r2Badge.color}`}>
                                    {r2Badge.label}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-right space-x-1">
                                  <button
                                    onClick={() => handleOpenModal(athlete)}
                                    className="p-1.5 text-slate-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors"
                                    title="Modifica Atleta"
                                  >
                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                  </button>
                                  <button
                                    onClick={() => setDeleteConfirmId(athlete.id)}
                                    className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                                    title="Elimina"
                                  >
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    <div className="lg:hidden divide-y divide-slate-100">
                      {filteredAtlete.map((athlete) => {
                        const certStatus = getCertStatus(athlete.scadenzaCertificato);
                        const r1Badge = getPaymentBadge(athlete.pagamentoRata1);
                        const r2Badge = getPaymentBadge(athlete.pagamentoRata2);

                        return (
                          <div key={athlete.id} className="p-4 space-y-3">
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="font-bold text-slate-900 text-sm">
                                  {athlete.cognome} {athlete.nome}
                                </h4>
                                <p className="text-xs font-mono text-slate-500">{athlete.codiceFiscale || 'CF Assente'}</p>
                              </div>
                              <div className="flex space-x-1">
                                <button
                                  onClick={() => handleOpenModal(athlete)}
                                  className="p-2 text-slate-600 bg-slate-100 hover:bg-red-50 hover:text-red-700 rounded-lg"
                                >
                                  <i data-lucide="edit-3" className="w-4 h-4"></i>
                                </button>
                                <button
                                  onClick={() => setDeleteConfirmId(athlete.id)}
                                  className="p-2 text-slate-400 bg-slate-100 hover:bg-red-50 hover:text-red-600 rounded-lg"
                                >
                                  <i data-lucide="trash-2" className="w-4 h-4"></i>
                                </button>
                              </div>
                            </div>

                            <div className="flex flex-wrap gap-1">
                              {(athlete.categorie || []).map(cat => (
                                <span key={cat} className="bg-red-50 text-red-800 border border-red-200 px-2 py-0.5 rounded-md font-bold text-[10px]">
                                  {cat}
                                </span>
                              ))}
                            </div>

                            <div className="grid grid-cols-2 gap-2 text-xs pt-1">
                              <div>
                                <span className="text-slate-400 block text-[10px]">Data Nascita</span>
                                <span className="font-semibold text-slate-700">{athlete.dataNascita || '-'}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block text-[10px]">Certificato Medico</span>
                                <span className={`inline-flex items-center space-x-1 px-2 py-0.5 rounded-full text-[10px] border ${certStatus.color}`}>
                                  <span>{athlete.scadenzaCertificato || 'Mancante'}</span>
                                </span>
                              </div>
                            </div>

                            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 grid grid-cols-2 gap-2 text-xs">
                              <div>
                                <span className="text-slate-400 block text-[10px] mb-1">I Rata</span>
                                <span className={`px-2 py-0.5 rounded text-[10px] border ${r1Badge.color}`}>
                                  {r1Badge.label}
                                </span>
                              </div>
                              <div>
                                <span className="text-slate-400 block text-[10px] mb-1">II Rata</span>
                                <span className={`px-2 py-0.5 rounded text-[10px] border ${r2Badge.color}`}>
                                  {r2Badge.label}
                                </span>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </main>

              {/* Modal Form */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-slate-100 my-8">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                      <h2 className="text-lg font-bold text-slate-800">
                        {currentAthlete ? 'Modifica Scheda Atleta' : 'Inserisci Nuova Atleta'}
                      </h2>
                      <button 
                        onClick={() => setIsModalOpen(false)}
                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                      >
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4 pt-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Nome *</label>
                          <input
                            type="text"
                            required
                            value={formData.nome}
                            onChange={(e) => setFormData({ ...formData, nome: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Cognome *</label>
                          <input
                            type="text"
                            required
                            value={formData.cognome}
                            onChange={(e) => setFormData({ ...formData, cognome: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Codice Fiscale</label>
                          <input
                            type="text"
                            maxLength={16}
                            value={formData.codiceFiscale}
                            onChange={(e) => setFormData({ ...formData, codiceFiscale: e.target.value.toUpperCase() })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono uppercase focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Data di Nascita</label>
                          <input
                            type="date"
                            value={formData.dataNascita}
                            onChange={(e) => setFormData({ ...formData, dataNascita: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1.5">
                          Categorie di Appartenenza (Seleziona Multiple)
                        </label>
                        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                          {CATEGORIES.map(cat => {
                            const selected = formData.categorie.includes(cat);
                            return (
                              <button
                                type="button"
                                key={cat}
                                onClick={() => handleCategoryToggle(cat)}
                                className={`py-2 px-3 text-xs font-bold rounded-xl border transition-all flex items-center justify-center space-x-1 ${
                                  selected
                                    ? 'bg-red-700 text-white border-red-700 shadow-md shadow-red-700/20'
                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                }`}
                              >
                                {selected && <i data-lucide="check" className="w-3 h-3"></i>}
                                <span>{cat}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="block text-xs font-bold text-slate-700">
                            Scadenza Certificato Medico
                          </label>
                          {formData.scadenzaCertificato && (
                            <button
                              type="button"
                              onClick={() => setFormData({ ...formData, scadenzaCertificato: '' })}
                              className="text-[11px] text-red-600 font-semibold hover:underline"
                            >
                              Svuota Data
                            </button>
                          )}
                        </div>
                        <input
                          type="date"
                          value={formData.scadenzaCertificato}
                          onChange={(e) => setFormData({ ...formData, scadenzaCertificato: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                        />
                      </div>

                      <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-3">
                        <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider">Stato Pagamento Quote</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs text-slate-600 font-medium mb-1">Stato I Rata</label>
                            <select
                              value={formData.pagamentoRata1}
                              onChange={(e) => setFormData({ ...formData, pagamentoRata1: e.target.value })}
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-red-600 outline-none"
                            >
                              {PAYMENT_STATUSES.map(st => (
                                <option key={st} value={st}>{st}</option>
                              ))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs text-slate-600 font-medium mb-1">Stato II Rata</label>
                            <select
                              value={formData.pagamentoRata2}
                              onChange={(e) => setFormData({ ...formData, pagamentoRata2: e.target.value })}
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-red-600 outline-none"
                            >
                              {PAYMENT_STATUSES.map(st => (
                                <option key={st} value={st}>{st}</option>
                              ))}
                            </select>
                          </div>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Note Aggiuntive</label>
                        <textarea
                          rows={2}
                          value={formData.note}
                          onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                          placeholder="Note mediche, contatto genitori, note logistiche..."
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-red-600 outline-none"
                        />
                      </div>

                      <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button
                          type="button"
                          onClick={() => setIsModalOpen(false)}
                          className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-sm transition-all"
                        >
                          Annulla
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2.5 bg-red-700 hover:bg-red-800 text-white rounded-xl font-medium text-sm shadow-lg shadow-red-700/20 transition-all"
                        >
                          {currentAthlete ? 'Salva Modifiche' : 'Inserisci Atleta'}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Import Preview Modal */}
              {isImportModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl border border-slate-100 my-8">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                      <div className="flex items-center space-x-2">
                        <i data-lucide="file-spreadsheet" className="w-6 h-6 text-emerald-600"></i>
                        <h2 className="text-xl font-bold text-slate-800">
                          Anteprima Importazione ({importRows.length} Atlete Rilevate)
                        </h2>
                      </div>
                      <button 
                        onClick={() => setIsImportModalOpen(false)}
                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                      >
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <p className="text-xs text-slate-500 my-3">
                      Le prime 5 righe del file sono state escluse automaticamente. Verifica l'anteprima dei dati estratti prima di confermare.
                    </p>

                    <div className="max-h-80 overflow-y-auto border border-slate-200 rounded-xl my-3">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-100 sticky top-0 border-b border-slate-200">
                          <tr>
                            <th className="p-2.5 font-bold">Cognome</th>
                            <th className="p-2.5 font-bold">Nome</th>
                            <th className="p-2.5 font-bold">CF</th>
                            <th className="p-2.5 font-bold">Data Nascita</th>
                            <th className="p-2.5 font-bold">Categorie</th>
                            <th className="p-2.5 font-bold">Certificato</th>
                            <th className="p-2.5 font-bold">I Rata</th>
                            <th className="p-2.5 font-bold">II Rata</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {importRows.map((row, idx) => (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="p-2.5 font-semibold">{row.cognome}</td>
                              <td className="p-2.5 font-semibold">{row.nome}</td>
                              <td className="p-2.5 font-mono">{row.codiceFiscale || '-'}</td>
                              <td className="p-2.5">{row.dataNascita || '-'}</td>
                              <td className="p-2.5">{row.categorie.join(', ') || '-'}</td>
                              <td className="p-2.5">{row.scadenzaCertificato || '-'}</td>
                              <td className="p-2.5">{row.pagamentoRata1}</td>
                              <td className="p-2.5">{row.pagamentoRata2}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsImportModalOpen(false)}
                        className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-sm transition-all"
                      >
                        Annulla
                      </button>
                      <button
                        type="button"
                        disabled={importing}
                        onClick={handleConfirmImport}
                        className="flex items-center space-x-2 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-medium text-sm shadow-lg shadow-emerald-600/20 transition-all disabled:opacity-50"
                      >
                        {importing && <i data-lucide="refresh-cw" className="w-4 h-4 animate-spin"></i>}
                        <span>Conferma e Salva in Database</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Install Instructions Modal */}
              {isInstallModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 my-8 space-y-4">
                    <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                      <div className="flex items-center space-x-2">
                        <i data-lucide="smartphone" className="w-6 h-6 text-blue-600"></i>
                        <h2 className="text-lg font-bold text-slate-800">Installa su Smartphone (Gratis)</h2>
                      </div>
                      <button 
                        onClick={() => setIsInstallModalOpen(false)}
                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors"
                      >
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>
                    </div>

                    <p className="text-xs text-slate-600">
                      Puoi salvare ed utilizzare quest'App come una qualsiasi applicazione nativa sul tuo telefono o tablet, senza passare da App Store / Play Store.
                    </p>

                    <div className="space-y-4 text-xs">
                      <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                        <div className="font-bold text-slate-900 flex items-center space-x-2">
                          <span className="w-5 h-5 rounded-full bg-slate-900 text-white flex items-center justify-center text-[10px]">1</span>
                          <span>Su iPhone / iPad (Safari)</span>
                        </div>
                        <ol className="list-decimal pl-6 space-y-1 text-slate-600">
                          <li>Apri questa pagina nel browser <strong>Safari</strong>.</li>
                          <li>Tocca il pulsante di <strong>Condivisione</strong> <i data-lucide="share" className="w-3.5 h-3.5 inline mx-1 text-blue-600"></i> in basso al centro.</li>
                          <li>Scorri nel menu e seleziona <strong>"Aggiungi alla schermata Home"</strong>.</li>
                          <li>Tocca <strong>Aggiungi</strong> in alto a destra.</li>
                        </ol>
                      </div>

                      <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                        <div className="font-bold text-slate-900 flex items-center space-x-2">
                          <span className="w-5 h-5 rounded-full bg-slate-900 text-white flex items-center justify-center text-[10px]">2</span>
                          <span>Su Android (Chrome)</span>
                        </div>
                        <ol className="list-decimal pl-6 space-y-1 text-slate-600">
                          <li>Apri questa pagina nel browser <strong>Google Chrome</strong>.</li>
                          <li>Tocca i <strong>3 puntini verticali</strong> in alto a destra.</li>
                          <li>Seleziona <strong>"Aggiungi a Schermata Home"</strong> oppure <strong>"Installa applicazione"</strong>.</li>
                          <li>Conferma cliccando su <strong>Installa</strong>.</li>
                        </ol>
                      </div>
                    </div>

                    <div className="pt-2 flex justify-end">
                      <button
                        onClick={() => setIsInstallModalOpen(false)}
                        className="w-full sm:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium text-xs transition-all"
                      >
                        Ho Capito!
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Delete Confirmation Modal */}
              {deleteConfirmId && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center space-y-4">
                    <div className="w-12 h-12 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto">
                      <i data-lucide="shield-alert" className="w-6 h-6"></i>
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Confermi l'eliminazione?</h3>
                      <p className="text-xs text-slate-500 mt-1">Questa azione non può essere annullata. L'atleta verrà rimossa dal database comune.</p>
                    </div>
                    <div className="flex space-x-3 pt-2">
                      <button
                        onClick={() => setDeleteConfirmId(null)}
                        className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium text-sm transition-all"
                      >
                        Annulla
                      </button>
                      <button
                        onClick={() => handleDelete(deleteConfirmId)}
                        className="flex-1 py-2.5 bg-red-600 hover:bg-red-500 text-white rounded-xl font-medium text-sm shadow-lg shadow-red-600/20 transition-all"
                      >
                        Elimina
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        setTimeout(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, 100);
    </script>
</body>
</html>
