<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per compilar JSX nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS per supporto completo Excel (.xlsx, .xls) e CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- PWA Icon Meta Tag -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23B81D24'/><path d='M35 25 L65 25 L50 75 Z' fill='white'/><circle cx='80' cy='20' r='12' fill='%23475569'/><path d='M76 20 L84 20 M80 16 L80 24' stroke='white' stroke-width='3'/></svg>">
    
    <!-- Firebase SDKs compatibili -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Configurazione Firebase
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
          apiKey: "demo-api-key",
          authDomain: "demo-app.firebaseapp.com",
          projectId: "demo-app",
          storageBucket: "demo-app.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pallavolo-atlete-app';

        const CATEGORIES = ['B2', '1D', 'U19', 'U17', 'U15', 'U13'];
        const PAYMENT_STATUSES = ['NON DOVUTO', 'DA PAGARE', 'PAGATO'];

        // Logo Vettoriale ASD Monteroni Volley
        function MonteroniLogo({ className = "w-10 h-10" }) {
          return (
            <div className="relative inline-block">
              <svg className={className} viewBox="0 0 400 450" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(100, 10) scale(0.5)">
                  <circle cx="200" cy="150" r="120" fill="white" stroke="#B81D24" strokeWidth="16"/>
                  <path d="M 200 30 C 230 80, 230 140, 200 270" stroke="#B81D24" strokeWidth="14" fill="none" />
                  <path d="M 110 80 C 180 120, 220 180, 290 220" stroke="#B81D24" strokeWidth="14" fill="none" />
                  <path d="M 290 80 C 220 120, 180 180, 110 220" stroke="#B81D24" strokeWidth="14" fill="none" />
                </g>
                <path d="M 60 120 Q 200 70 340 120 Q 380 260 200 420 Q 20 260 60 120 Z" fill="#B81D24" stroke="white" strokeWidth="10"/>
                <path d="M 75 132 Q 200 88 325 132 Q 360 255 200 400 Q 40 255 75 132 Z" fill="white" />
                <path d="M 82 340 Q 130 280 170 330 Q 200 270 230 330 Q 270 290 318 340 L 318 350 Q 200 400 200 400 Z" fill="#B81D24" />
                <text x="200" y="210" textAnchor="middle" fill="#B81D24" fontFamily="Impact, sans-serif" fontSize="42" fontWeight="900">MONTERONI</text>
                <text x="200" y="250" textAnchor="middle" fill="#B81D24" fontFamily="Impact, sans-serif" fontSize="34" fontWeight="bold">VOLLEY</text>
                <text x="200" y="380" textAnchor="middle" fill="white" fontFamily="Arial, sans-serif" fontSize="28" fontWeight="bold">ASD</text>
              </svg>
            </div>
          );
        }

        function App() {
          const [user, setUser] = useState(null);
          const [atlete, setAtlete] = useState([]);
          const [loading, setLoading] = useState(true);

          const [activeTab, setActiveTab] = useState('ALL');
          const [searchQuery, setSearchQuery] = useState('');
          const [certFilter, setCertFilter] = useState('ALL');
          const [paymentFilter, setPaymentFilter] = useState('ALL');

          const [isModalOpen, setIsModalOpen] = useState(false);
          const [isImportModalOpen, setIsImportModalOpen] = useState(false);
          const [isInstallModalOpen, setIsInstallModalOpen] = useState(false);
          const [currentAthlete, setCurrentAthlete] = useState(null);
          const [deleteConfirmId, setDeleteConfirmId] = useState(null);

          const [importRows, setImportRows] = useState([]);
          const [importing, setImporting] = useState(false);

          const [formData, setFormData] = useState({
            nomeCompleto: '',
            matricola: '',
            anno: '',
            codiceFiscale: '',
            dataNascita: '',
            societaAppartenenza: '',
            categorie: [],
            scadenzaCertificato: '',
            pagamentoRata1: 'NON DOVUTO',
            pagamentoRata2: 'NON DOVUTO',
            note: ''
          });

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                  await auth.signInAnonymously();
                }
              } catch (err) {
                console.error("Auth Error:", err);
              }
            };
            initAuth();
            const unsubscribe = auth.onAuthStateChanged((u) => {
              setUser(u);
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;

            setLoading(true);
            const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
            
            const unsubscribe = atleteRef.onSnapshot(
              (snapshot) => {
                const list = snapshot.docs.map(doc => ({
                  id: doc.id,
                  ...doc.data()
                }));
                setAtlete(list);
                setLoading(false);
              },
              (err) => {
                console.error("Firestore Error:", err);
                setLoading(false);
              }
            );

            return () => unsubscribe();
          }, [user]);

          const getCertStatus = (dateString) => {
            if (!dateString) return { status: 'UNKNOWN', label: 'Non Inserito', color: 'bg-slate-100 text-slate-700 border-slate-300' };
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const certDate = new Date(dateString);
            certDate.setHours(0, 0, 0, 0);

            if (isNaN(certDate.getTime())) {
              return { status: 'UNKNOWN', label: 'Non Valido', color: 'bg-slate-100 text-slate-700 border-slate-300' };
            }

            const diffDays = Math.ceil((certDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
              return { status: 'EXPIRED', label: 'Scaduto', color: 'bg-red-100 text-red-700 border-red-300 shadow-sm font-bold', days: Math.abs(diffDays) };
            } else if (diffDays <= 30) {
              return { status: 'EXPIRING', label: `In Scadenza (${diffDays} gg)`, color: 'bg-amber-100 text-amber-800 border-amber-300 shadow-sm font-semibold', days: diffDays };
            } else {
              return { status: 'VALID', label: 'Valido', color: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-medium', days: diffDays };
            }
          };

          const getPaymentBadge = (status) => {
            const st = status || 'NON DOVUTO';
            switch (st) {
              case 'PAGATO':
                return { label: 'PAGATO', color: 'bg-emerald-100 text-emerald-800 border-emerald-300 font-semibold' };
              case 'DA PAGARE':
                return { label: 'DA PAGARE', color: 'bg-red-100 text-red-800 border-red-300 font-bold' };
              case 'NON DOVUTO':
              default:
                return { label: 'NON DOVUTO', color: 'bg-slate-100 text-slate-500 border-slate-200' };
            }
          };

          const handleOpenModal = (athlete = null) => {
            if (athlete) {
              setCurrentAthlete(athlete);
              setFormData({
                nomeCompleto: athlete.nomeCompleto || `${athlete.cognome || ''} ${athlete.nome || ''}`.trim(),
                matricola: athlete.matricola || '',
                anno: athlete.anno || '',
                codiceFiscale: athlete.codiceFiscale || '',
                dataNascita: athlete.dataNascita || '',
                societaAppartenenza: athlete.societaAppartenenza || '',
                categorie: athlete.categorie || [],
                scadenzaCertificato: athlete.scadenzaCertificato || '',
                pagamentoRata1: athlete.pagamentoRata1 || 'NON DOVUTO',
                pagamentoRata2: athlete.pagamentoRata2 || 'NON DOVUTO',
                note: athlete.note || ''
              });
            } else {
              setCurrentAthlete(null);
              setFormData({
                nomeCompleto: '',
                matricola: '',
                anno: new Date().getFullYear().toString(),
                codiceFiscale: '',
                dataNascita: '',
                societaAppartenenza: '',
                categorie: activeTab !== 'ALL' ? [activeTab] : [],
                scadenzaCertificato: '',
                pagamentoRata1: 'NON DOVUTO',
                pagamentoRata2: 'NON DOVUTO',
                note: ''
              });
            }
            setIsModalOpen(true);
          };

          const handleCategoryToggle = (cat) => {
            setFormData(prev => {
              const exists = prev.categorie.includes(cat);
              if (exists) {
                return { ...prev, categorie: prev.categorie.filter(c => c !== cat) };
              } else {
                return { ...prev, categorie: [...prev.categorie, cat] };
              }
            });
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (!formData.nomeCompleto) {
              alert("Nome e Cognome sono obbligatori.");
              return;
            }

            try {
              const dataToSave = {
                ...formData,
                codiceFiscale: (formData.codiceFiscale || '').toUpperCase().trim(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              };

              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');

              if (currentAthlete) {
                await atleteRef.doc(currentAthlete.id).update(dataToSave);
              } else {
                await atleteRef.add({
                  ...dataToSave,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
              setIsModalOpen(false);
            } catch (err) {
              console.error("Errore salvataggio:", err);
              alert("Si è verificato un errore durante il salvataggio dei dati.");
            }
          };

          // Conversione da Excel/CSV tollerante a dati mancanti
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const parseExcelDate = (val) => {
              if (!val) return '';
              if (typeof val === 'number') {
                const dateObj = XLSX.SSF.parse_date_code(val);
                if (dateObj) {
                  const y = dateObj.y;
                  const m = String(dateObj.m).padStart(2, '0');
                  const d = String(dateObj.d).padStart(2, '0');
                  return `${y}-${m}-${d}`;
                }
              }
              const str = String(val).trim();
              if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 3) {
                  if (parts[2].length === 4) {
                    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                  }
                }
              }
              return str;
            };

            const processRows = (rows) => {
              // Salta 5 righe (dati da riga 6)
              const dataRows = rows.slice(5);

              const parsed = dataRows.map((cols) => {
                if (!cols || cols.length === 0) return null;

                const nomeCompleto = (cols[2] || '').toString().trim();
                if (!nomeCompleto) return null;

                const anno = (cols[0] || '').toString().trim();
                const matricola = (cols[1] || '').toString().trim();
                const codiceFiscale = (cols[4] || '').toString().toUpperCase().trim();
                const dataNascita = parseExcelDate(cols[5]);
                const societaAppartenenza = (cols[15] || '').toString().trim();
                const certDate = parseExcelDate(cols[27]);

                return {
                  nomeCompleto,
                  anno,
                  matricola,
                  codiceFiscale,
                  dataNascita,
                  societaAppartenenza,
                  categorie: activeTab !== 'ALL' ? [activeTab] : [],
                  scadenzaCertificato: certDate || '',
                  pagamentoRata1: 'NON DOVUTO',
                  pagamentoRata2: 'NON DOVUTO',
                  note: ''
                };
              }).filter(Boolean);

              setImportRows(parsed);
              setIsImportModalOpen(true);
            };

            const reader = new FileReader();
            if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
              reader.onload = (event) => {
                try {
                  const data = new Uint8Array(event.target.result);
                  const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                  const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                  const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                  processRows(rows);
                } catch (err) {
                  alert("Impossibile leggere il file Excel.");
                }
              };
              reader.readAsArrayBuffer(file);
            } else {
              reader.onload = (event) => {
                try {
                  const text = event.target.result;
                  const lines = text.split(/\r\n|\n/);
                  const rows = lines.map(l => {
                    const sep = l.includes(';') ? ';' : ',';
                    return l.split(sep).map(c => c.trim().replace(/^"(.*)"$/, '$1'));
                  });
                  processRows(rows);
                } catch (err) {
                  alert("Errore durante la lettura del file CSV.");
                }
              };
              reader.readAsText(file);
            }
            e.target.value = null;
          };

          const handleConfirmImport = async () => {
            if (importRows.length === 0) return;
            setImporting(true);

            try {
              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
              for (const item of importRows) {
                await atleteRef.add({
                  ...item,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
              setIsImportModalOpen(false);
              setImportRows([]);
              alert(`Importate con successo ${importRows.length} atlete!`);
            } catch (err) {
              console.error("Errore importazione:", err);
              alert("Si è verificato un errore durante l'importazione.");
            } finally {
              setImporting(false);
            }
          };

          const handleDelete = async (id) => {
            try {
              const atleteRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('atlete');
              await atleteRef.doc(id).delete();
              setDeleteConfirmId(null);
            } catch (err) {
              alert("Errore durante l'eliminazione.");
            }
          };

          const filteredAtlete = useMemo(() => {
            return atlete.filter(item => {
              const searchLower = searchQuery.toLowerCase();
              const fullName = (item.nomeCompleto || `${item.cognome || ''} ${item.nome || ''}`).toLowerCase();
              const cf = (item.codiceFiscale || '').toLowerCase();
              
              const matchesSearch = !searchQuery || fullName.includes(searchLower) || cf.includes(searchLower);
              const matchesTab = activeTab === 'ALL' || (item.categorie && item.categorie.includes(activeTab));

              const certInfo = getCertStatus(item.scadenzaCertificato);
              let matchesCert = true;
              if (certFilter === 'EXPIRED') matchesCert = certInfo.status === 'EXPIRED';
              if (certFilter === 'EXPIRING') matchesCert = certInfo.status === 'EXPIRING';
              if (certFilter === 'VALID') matchesCert = certInfo.status === 'VALID';
              if (certFilter === 'PROBLEMATIC') matchesCert = certInfo.status === 'EXPIRED' || certInfo.status === 'EXPIRING';

              let matchesPayment = true;
              const r1 = item.pagamentoRata1 || 'NON DOVUTO';
              const r2 = item.pagamentoRata2 || 'NON DOVUTO';

              if (paymentFilter === 'PENDING_1') matchesPayment = r1 === 'DA PAGARE';
              if (paymentFilter === 'PENDING_2') matchesPayment = r2 === 'DA PAGARE';
              if (paymentFilter === 'PENDING_ANY') matchesPayment = r1 === 'DA PAGARE' || r2 === 'DA PAGARE';

              return matchesSearch && matchesTab && matchesCert && matchesPayment;
            });
          }, [atlete, searchQuery, activeTab, certFilter, paymentFilter]);

          const stats = useMemo(() => {
            let expired = 0;
            let expiring = 0;
            let pendingPayments = 0;

            atlete.forEach(item => {
              const status = getCertStatus(item.scadenzaCertificato).status;
              if (status === 'EXPIRED') expired++;
              if (status === 'EXPIRING') expiring++;

              if (item.pagamentoRata1 === 'DA PAGARE' || item.pagamentoRata2 === 'DA PAGARE') {
                pendingPayments++;
              }
            });

            return { total: atlete.length, expired, expiring, pendingPayments };
          }, [atlete]);

          const exportCSV = () => {
            if (atlete.length === 0) return;

            const headers = ["Anno", "Matricola", "Atleta", "Codice Fiscale", "Data Nascita", "Societa Appartenenza", "Categorie", "Scadenza Certificato", "I Rata", "II Rata", "Note"];
            const rows = filteredAtlete.map(a => [
              `"${a.anno || ''}"`,
              `"${a.matricola || ''}"`,
              `"${a.nomeCompleto || `${a.cognome || ''} ${a.nome || ''}`.trim()}"`,
              `"${a.codiceFiscale || ''}"`,
              `"${a.dataNascita || ''}"`,
              `"${a.societaAppartenenza || ''}"`,
              `"${(a.categorie || []).join(', ')}"`,
              `"${a.scadenzaCertificato || ''}"`,
              `"${a.pagamentoRata1 || 'NON DOVUTO'}"`,
              `"${a.pagamentoRata2 || 'NON DOVUTO'}"`,
              `"${(a.note || '').replace(/"/g, '""')}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `atlete_monteroni_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans pb-12">
              {/* Header Bar */}
              <header className="bg-gradient-to-r from-red-800 via-[#B81D24] to-red-900 text-white shadow-md sticky top-0 z-20">
                <div className="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex items-center justify-between">
                  <div className="flex items-center space-x-3">
                    <div className="p-1 bg-white rounded-2xl shadow-md">
                      <MonteroniLogo className="w-9 h-10" />
                    </div>
                    <div>
                      <h1 className="text-lg sm:text-xl font-bold tracking-tight text-white">ASD Monteroni Volley Manager</h1>
                      <p className="text-xs text-red-100">Database Condiviso Atlete</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => setIsInstallModalOpen(true)}
                      className="flex items-center space-x-1.5 bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all"
                    >
                      <span>Installa App</span>
                    </button>

                    <button
                      onClick={() => handleOpenModal()}
                      className="flex items-center space-x-1.5 bg-white hover:bg-red-50 text-red-700 px-3.5 py-2 rounded-xl font-bold shadow-lg shadow-black/10 transition-all text-xs sm:text-sm"
                    >
                      <span>+ Nuova Atleta</span>
                    </button>
                  </div>
                </div>

                {/* Category Tabs */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto no-scrollbar space-x-1 pt-1">
                  <button
                    onClick={() => setActiveTab('ALL')}
                    className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-t-xl transition-all flex-shrink-0 flex items-center space-x-2 ${
                      activeTab === 'ALL'
                        ? 'bg-slate-50 text-red-800 border-t-2 border-red-500 font-bold'
                        : 'text-red-100 hover:bg-white/10'
                    }`}
                  >
                    <span>Tutte le Atlete</span>
                    <span className="bg-red-900/50 text-red-100 px-2 py-0.5 rounded-full text-[10px]">
                      {atlete.length}
                    </span>
                  </button>
                  {CATEGORIES.map(cat => {
                    const count = atlete.filter(a => a.categorie && a.categorie.includes(cat)).length;
                    return (
                      <button
                        key={cat}
                        onClick={() => setActiveTab(cat)}
                        className={`px-4 py-2 text-xs sm:text-sm font-semibold rounded-t-xl transition-all flex-shrink-0 flex items-center space-x-2 ${
                          activeTab === cat
                            ? 'bg-slate-50 text-red-800 border-t-2 border-red-500 font-bold'
                            : 'text-red-100 hover:bg-white/10'
                        }`}
                      >
                        <span>{cat}</span>
                        <span className="bg-red-900/50 text-red-100 px-2 py-0.5 rounded-full text-[10px]">
                          {count}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">
                {/* KPI Dashboard Cards */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p className="text-xs text-slate-500 font-medium">Totale Atlete</p>
                    <p className="text-xl sm:text-2xl font-bold text-slate-900">{stats.total}</p>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p className="text-xs text-slate-500 font-medium">Cert. Scaduti</p>
                    <p className="text-xl sm:text-2xl font-bold text-red-600">{stats.expired}</p>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p className="text-xs text-slate-500 font-medium">In Scadenza (30g)</p>
                    <p className="text-xl sm:text-2xl font-bold text-amber-600">{stats.expiring}</p>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <p className="text-xs text-slate-500 font-medium">Rate Sospese</p>
                    <p className="text-xl sm:text-2xl font-bold text-rose-600">{stats.pendingPayments}</p>
                  </div>
                </div>

                {/* Filters and Actions Bar */}
                <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                    <div className="relative flex-1">
                      <input
                        type="text"
                        placeholder="Cerca per Nome, Cognome o Codice Fiscale..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:bg-white transition-all"
                      />
                    </div>

                    <div className="flex items-center space-x-2">
                      <label className="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold cursor-pointer transition-all">
                        <span>Importa Excel/CSV</span>
                        <input type="file" accept=".xlsx, .xls, .csv, .txt" onChange={handleFileUpload} className="hidden" />
                      </label>

                      <button
                        onClick={exportCSV}
                        className="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all"
                      >
                        <span>Esporta CSV</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100 text-xs">
                    <select
                      value={certFilter}
                      onChange={(e) => setCertFilter(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium outline-none"
                    >
                      <option value="ALL">Certificati: Tutti</option>
                      <option value="EXPIRED">🔴 Solo Scaduti</option>
                      <option value="EXPIRING">🟠 Solo In Scadenza (30 gg)</option>
                      <option value="PROBLEMATIC">⚠️ Scaduti o In Scadenza</option>
                      <option value="VALID">🟢 Solo Validi</option>
                    </select>

                    <select
                      value={paymentFilter}
                      onChange={(e) => setPaymentFilter(e.target.value)}
                      className="bg-slate-50 border border-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium outline-none"
                    >
                      <option value="ALL">Pagamenti: Tutti</option>
                      <option value="PENDING_1">I Rata DA PAGARE</option>
                      <option value="PENDING_2">II Rata DA PAGARE</option>
                      <option value="PENDING_ANY">Almeno una rata DA PAGARE</option>
                    </select>

                    {(certFilter !== 'ALL' || paymentFilter !== 'ALL' || searchQuery !== '') && (
                      <button
                        onClick={() => {
                          setCertFilter('ALL');
                          setPaymentFilter('ALL');
                          setSearchQuery('');
                        }}
                        className="text-red-700 font-semibold hover:underline ml-auto"
                      >
                        Resetta Filtri
                      </button>
                    )}
                  </div>
                </div>

                {/* Tabella Atlete */}
                {loading ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
                    <p className="text-slate-500 text-sm font-medium">Caricamento in corso...</p>
                  </div>
                ) : filteredAtlete.length === 0 ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm">
                    <h3 className="text-base font-bold text-slate-700">Nessuna Atleta Trovata</h3>
                  </div>
                ) : (
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="hidden lg:block overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-100/80 border-b border-slate-200 text-slate-600 font-bold uppercase">
                          <tr>
                            <th className="py-3 px-4">Atleta</th>
                            <th className="py-3 px-4">Codice Fiscale</th>
                            <th className="py-3 px-4">Nascita</th>
                            <th className="py-3 px-4">Categorie</th>
                            <th className="py-3 px-4">Certificato Medico</th>
                            <th className="py-3 px-4 text-center">I Rata</th>
                            <th className="py-3 px-4 text-center">II Rata</th>
                            <th className="py-3 px-4 text-right">Azioni</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredAtlete.map((athlete) => {
                            const certStatus = getCertStatus(athlete.scadenzaCertificato);
                            const r1Badge = getPaymentBadge(athlete.pagamentoRata1);
                            const r2Badge = getPaymentBadge(athlete.pagamentoRata2);

                            return (
                              <tr key={athlete.id} className="hover:bg-slate-50/80 transition-colors">
                                <td className="py-3.5 px-4 font-bold text-slate-900">
                                  {athlete.nomeCompleto || `${athlete.cognome || ''} ${athlete.nome || ''}`}
                                  <div className="flex items-center space-x-2 mt-0.5">
                                    {athlete.matricola && <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">Matr: {athlete.matricola}</span>}
                                    {athlete.anno && <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">Anno: {athlete.anno}</span>}
                                    {athlete.societaAppartenenza && <span className="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-medium">Soc: {athlete.societaAppartenenza}</span>}
                                  </div>
                                </td>
                                <td className="py-3.5 px-4 font-mono text-slate-600">{athlete.codiceFiscale || '-'}</td>
                                <td className="py-3.5 px-4 text-slate-600">{athlete.dataNascita || '-'}</td>
                                <td className="py-3.5 px-4">
                                  <div className="flex flex-wrap gap-1">
                                    {(athlete.categorie || []).length > 0 ? (
                                      athlete.categorie.map(cat => (
                                        <span key={cat} className="bg-red-50 text-red-800 border border-red-200 px-2 py-0.5 rounded-md font-bold text-[10px]">
                                          {cat}
                                        </span>
                                      ))
                                    ) : (
                                      <span className="text-slate-400 text-[10px] italic">Nessuna</span>
                                    )}
                                  </div>
                                </td>
                                <td className="py-3.5 px-4">
                                  <span className={`inline-flex items-center space-x-1 px-2.5 py-1 rounded-full text-[11px] border ${certStatus.color}`}>
                                    <span>{athlete.scadenzaCertificato ? athlete.scadenzaCertificato : 'Mancante'}</span>
                                    <span className="opacity-75">({certStatus.label})</span>
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <span className={`px-2.5 py-1 rounded-md text-[10px] border ${r1Badge.color}`}>
                                    {r1Badge.label}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-center">
                                  <span className={`px-2.5 py-1 rounded-md text-[10px] border ${r2Badge.color}`}>
                                    {r2Badge.label}
                                  </span>
                                </td>
                                <td className="py-3.5 px-4 text-right space-x-1">
                                  <button
                                    onClick={() => handleOpenModal(athlete)}
                                    className="p-1.5 text-slate-600 hover:text-red-700 hover:bg-red-50 rounded-lg"
                                  >
                                    Modifica
                                  </button>
                                  <button
                                    onClick={() => setDeleteConfirmId(athlete.id)}
                                    className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg"
                                  >
                                    Elimina
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>

              {/* Modal Inserimento/Modifica */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl border border-slate-100 my-8">
                    <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                      <h2 className="text-lg font-bold text-slate-800">
                        {currentAthlete ? 'Modifica Scheda Atleta' : 'Inserisci Nuova Atleta'}
                      </h2>
                      <button onClick={() => setIsModalOpen(false)} className="text-slate-400">✕</button>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4 pt-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-slate-700 mb-1">Cognome e Nome *</label>
                          <input
                            type="text"
                            required
                            value={formData.nomeCompleto}
                            onChange={(e) => setFormData({ ...formData, nomeCompleto: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">N° Matricola (Col B)</label>
                          <input
                            type="text"
                            value={formData.matricola}
                            onChange={(e) => setFormData({ ...formData, matricola: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Anno (Col A)</label>
                          <input
                            type="text"
                            value={formData.anno}
                            onChange={(e) => setFormData({ ...formData, anno: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Codice Fiscale (Col E)</label>
                          <input
                            type="text"
                            maxLength={16}
                            value={formData.codiceFiscale}
                            onChange={(e) => setFormData({ ...formData, codiceFiscale: e.target.value.toUpperCase() })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono uppercase focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Data Nascita (Col F)</label>
                          <input
                            type="date"
                            value={formData.dataNascita}
                            onChange={(e) => setFormData({ ...formData, dataNascita: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Società Appartenenza / Prestito (Col P)</label>
                        <input
                          type="text"
                          placeholder="Es. ASD Monteroni Volley..."
                          value={formData.societaAppartenenza}
                          onChange={(e) => setFormData({ ...formData, societaAppartenenza: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1.5">Categorie di Appartenenza</label>
                        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                          {CATEGORIES.map(cat => {
                            const selected = formData.categorie.includes(cat);
                            return (
                              <button
                                type="button"
                                key={cat}
                                onClick={() => handleCategoryToggle(cat)}
                                className={`py-2 px-3 text-xs font-bold rounded-xl border transition-all ${
                                  selected
                                    ? 'bg-red-700 text-white border-red-700'
                                    : 'bg-slate-50 text-slate-600 border-slate-200'
                                }`}
                              >
                                {cat}
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between items-center mb-1">
                          <label className="block text-xs font-bold text-slate-700">Scadenza Certificato Medico (Col AB)</label>
                          {formData.scadenzaCertificato && (
                            <button
                              type="button"
                              onClick={() => setFormData({ ...formData, scadenzaCertificato: '' })}
                              className="text-[10px] text-red-600 font-semibold hover:underline"
                            >
                              Svuota Data
                            </button>
                          )}
                        </div>
                        <input
                          type="date"
                          value={formData.scadenzaCertificato}
                          onChange={(e) => setFormData({ ...formData, scadenzaCertificato: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-red-600 outline-none"
                        />
                      </div>

                      <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-3">
                        <h4 className="text-xs font-bold text-slate-700 uppercase">Stato Pagamento Quote</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs text-slate-600 font-medium mb-1">Stato I Rata</label>
                            <select
                              value={formData.pagamentoRata1}
                              onChange={(e) => setFormData({ ...formData, pagamentoRata1: e.target.value })}
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold outline-none"
                            >
                              {PAYMENT_STATUSES.map(st => (
                                <option key={st} value={st}>{st}</option>
                              ))}
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs text-slate-600 font-medium mb-1">Stato II Rata</label>
                            <select
                              value={formData.pagamentoRata2}
                              onChange={(e) => setFormData({ ...formData, pagamentoRata2: e.target.value })}
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold outline-none"
                            >
                              {PAYMENT_STATUSES.map(st => (
                                <option key={st} value={st}>{st}</option>
                              ))}
                            </select>
                          </div>
                        </div>
                      </div>

                      <div className="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button
                          type="button"
                          onClick={() => setIsModalOpen(false)}
                          className="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-medium text-sm"
                        >
                          Annulla
                        </button>
                        <button
                          type="submit"
                          className="px-5 py-2.5 bg-red-700 text-white rounded-xl font-medium text-sm shadow-lg shadow-red-700/20"
                        >
                          Salva Atleta
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Modal Anteprima Importazione */}
              {isImportModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                  <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl border border-slate-100 my-8">
                    <h2 className="text-xl font-bold text-slate-800">
                      Anteprima Importazione ({importRows.length} Atlete Trovate)
                    </h2>
                    <p className="text-xs text-slate-500 my-2">
                      I dati sono stati estratti automaticamente a partire dalla riga 6 del file.
                    </p>

                    <div className="max-h-80 overflow-y-auto border border-slate-200 rounded-xl my-3">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-100 sticky top-0 border-b border-slate-200">
                          <tr>
                            <th className="p-2.5">Atleta (Col C)</th>
                            <th className="p-2.5">CF (Col E)</th>
                            <th className="p-2.5">Nascita (Col F)</th>
                            <th className="p-2.5">Società (Col P)</th>
                            <th className="p-2.5">Certificato (Col AB)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {importRows.map((row, idx) => (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="p-2.5 font-semibold">{row.nomeCompleto}</td>
                              <td className="p-2.5 font-mono">{row.codiceFiscale || '-'}</td>
                              <td className="p-2.5">{row.dataNascita || '-'}</td>
                              <td className="p-2.5">{row.societaAppartenenza || '-'}</td>
                              <td className="p-2.5">{row.scadenzaCertificato || '-'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-100">
                      <button
                        type="button"
                        onClick={() => setIsImportModalOpen(false)}
                        className="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl font-medium text-sm"
                      >
                        Annulla
                      </button>
                      <button
                        type="button"
                        disabled={importing}
                        onClick={handleConfirmImport}
                        className="px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-medium text-sm shadow-lg shadow-emerald-600/20"
                      >
                        {importing ? 'Salvataggio...' : 'Conferma e Salva in Database'}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
