<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root">
        <div style="padding: 40px; text-align: center; font-family: sans-serif; color: #555;">
            <h2>Caricamento applicazione in corso...</h2>
        </div>
    </div>

    <!-- Firebase SDKs & Configurazione Reale -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyo2mckgZE2MahMFYGOX3h1iM1XhXrF7c",
            authDomain: "monteronivolleymanager.firebaseapp.com",
            projectId: "monteronivolleymanager",
            storageBucket: "monteronivolleymanager.firebasestorage.app",
            messagingSenderId: "167180215755",
            appId: "1:167180215755:web:ff3712b5dc0bc6879d424e"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const appId = 'monteroni-volley-atlete';

            window.firebaseDB = { db, auth, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc, appId };
            
            signInAnonymously(auth).catch((error) => {
                console.error("Errore autenticazione anonima:", error);
            });

            window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) {
            console.error("Errore inizializzazione Firebase:", err);
        }
    </script>

    <!-- Codice dell'Applicazione React -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = ['', 'B2', '1D', 'U19', 'U17', 'U15', 'U13'];
        const PAYMENT_STATUSES = ['', 'NON DOVUTO', 'DA PAGARE', 'PAGATO'];

        function App() {
            const [atlete, setAtlete] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TUTTE');
            const [modalOpen, setModalOpen] = useState(false);
            const [importModalOpen, setImportModalOpen] = useState(false);
            const [currentAtleta, setCurrentAtleta] = useState(null);
            const [importPreview, setImportPreview] = useState([]);
            const [importing, setImporting] = useState(false);
            const [toast, setToast] = useState(null);

            const [formData, setFormData] = useState({
                cognomeNome: '',
                matricola: '',
                anno: new Date().getFullYear().toString(),
                codiceFiscale: '',
                dataNascita: '',
                societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                categoria: '',
                dataCertificato: '',
                quotaIscrizione: '',
                note: ''
            });

            useEffect(() => {
                const initListener = () => {
                    if (!window.firebaseDB) {
                        setTimeout(initListener, 100);
                        return;
                    }
                    const { db, collection, onSnapshot, appId } = window.firebaseDB;
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'atlete');
                    
                    const unsubscribe = onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach((docSnap) => {
                            items.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setAtlete(items);
                        setLoading(false);
                    }, (error) => {
                        console.error("Errore lettura database:", error);
                        setLoading(false);
                        showToast("Errore di connessione al database", "error");
                    });

                    return () => unsubscribe();
                };

                if (window.firebaseDB) {
                    initListener();
                } else {
                    window.addEventListener('firebase-ready', initListener);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const cleanSocieta = (val) => {
                if (!val) return 'MONTERONI VOLLEY A.S.D.';
                let str = val.toString().trim();
                str = str.replace(/^[\/\-\s]+/, '');
                return str.toUpperCase();
            };

            // Parser date semplice e sicuro
            const parseDateParts = (dateStr) => {
                if (!dateStr) return null;
                let str = dateStr.toString().trim();
                if (!str) return null;

                let parts = [];
                if (str.includes('/')) {
                    parts = str.split('/');
                } else if (str.includes('-')) {
                    parts = str.split('-');
                }

                if (parts.length !== 3) return null;

                let d, m, y;
                if (parts[0].length === 4) {
                    y = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10);
                    d = parseInt(parts[2], 10);
                } else {
                    d = parseInt(parts[0], 10);
                    m = parseInt(parts[1], 10);
                    y = parseInt(parts[2], 10);
                }

                if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
                return { d, m, y };
            };

            const formatDateDisplay = (dateStr) => {
                const p = parseDateParts(dateStr);
                if (!p) return dateStr || 'Assente';
                return `${String(p.d).padStart(2, '0')}/${String(p.m).padStart(2, '0')}/${p.y}`;
            };

            // Logica colori basata su oggi (11 novembre 2026)
            const getCertStatus = (dateStr) => {
                const p = parseDateParts(dateStr);
                if (!p) return 'red'; // Assente / non valida -> Rosso

                const expiryVal = p.y * 10000 + p.m * 100 + p.d;
                const todayVal = 2026 * 10000 + 11 * 100 + 11; // 11/11/2026

                if (expiryVal < todayVal) {
                    return 'red'; // Scaduto -> Rosso
                }

                // Limite a 2 mesi da oggi (11 gennaio 2027 -> 20270111)
                const twoMonthsVal = 2027 * 10000 + 1 * 100 + 11;

                if (expiryVal <= twoMonthsVal) {
                    return 'yellow'; // In scadenza entro 2 mesi -> Giallo
                }

                return 'green'; // Valido oltre 2 mesi -> Verde
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!window.firebaseDB) return;

                const cfPulito = formData.codiceFiscale.trim().toUpperCase();

                if (!currentAtleta) {
                    const esiste = atlete.some(a => (a.codiceFiscale || '').trim().toUpperCase() === cfPulito);
                    if (esiste) {
                        alert("Atleta già inserita");
                        return;
                    }
                }

                const { db, collection, addDoc, updateDoc, doc, appId } = window.firebaseDB;
                const payload = {
                    ...formData,
                    cognomeNome: formData.cognomeNome.trim().toUpperCase(),
                    codiceFiscale: cfPulito,
                    societaAppartenenza: cleanSocieta(formData.societaAppartenenza),
                    updatedAt: new Date().toISOString()
                };

                try {
                    if (currentAtleta) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', currentAtleta.id), payload);
                        showToast("Atleta aggiornata con successo");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'), {
                            ...payload,
                            createdAt: new Date().toISOString()
                        });
                        showToast("Atleta inserita con successo");
                    }
                    setModalOpen(false);
                    resetForm();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    showToast("Errore durante il salvataggio", "error");
                }
            };

            const resetForm = () => {
                setFormData({
                    cognomeNome: '',
                    matricola: '',
                    anno: new Date().getFullYear().toString(),
                    codiceFiscale: '',
                    dataNascita: '',
                    societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                    categoria: '',
                    dataCertificato: '',
                    quotaIscrizione: '',
                    note: ''
                });
                setCurrentAtleta(null);
            };

            const handleDelete = async (id) => {
                if (!confirm("Sei sicuro di voler eliminare questa atleta?")) return;
                if (!window.firebaseDB) return;
                const { db, doc, delete
