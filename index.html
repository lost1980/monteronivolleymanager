<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) per leggere file Excel e CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <!-- Firebase SDKs & Configurazione Reale -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyo2mckgZE2MahMFYGOX3h1iM1XhXrF7c",
            authDomain: "monteronivolleymanager.firebaseapp.com",
            projectId: "monteronivolleymanager",
            storageBucket: "monteronivolleymanager.firebasestorage.app",
            messagingSenderId: "167180215755",
            appId: "1:167180215755:web:ff3712b5dc0bc6879d424e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'monteroni-volley-atlete';

        window.firebaseDB = { db, auth, collection, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch, doc, appId };
        
        signInAnonymously(auth).catch((error) => {
            console.error("Errore autenticazione anonima:", error);
        });

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- Codice dell'Applicazione React -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = ['', 'B2', '1D', 'U19', 'U17', 'U15', 'U13'];
        const PAYMENT_STATUSES = ['', 'NON DOVUTO', 'DA PAGARE', 'PAGATO'];

        function App() {
            const [atlete, setAtlete] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TUTTE');
            const [modalOpen, setModalOpen] = useState(false);
            const [importModalOpen, setImportModalOpen] = useState(false);
            const [currentAtleta, setCurrentAtleta] = useState(null);
            const [importPreview, setImportPreview] = useState([]);
            const [importing, setImporting] = useState(false);
            const [toast, setToast] = useState(null);

            const [formData, setFormData] = useState({
                cognomeNome: '',
                matricola: '',
                anno: new Date().getFullYear().toString(),
                codiceFiscale: '',
                dataNascita: '',
                societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                categoria: '',
                dataCertificato: '',
                quotaIscrizione: '',
                note: ''
            });

            useEffect(() => {
                const initListener = () => {
                    if (!window.firebaseDB) {
                        setTimeout(initListener, 200);
                        return;
                    }
                    const { db, collection, onSnapshot, appId } = window.firebaseDB;
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'atlete');
                    
                    const unsubscribe = onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach((docSnap) => {
                            items.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setAtlete(items);
                        setLoading(false);
                    }, (error) => {
                        console.error("Errore lettura database:", error);
                        setLoading(false);
                        showToast("Errore di connessione al database", "error");
                    });

                    return () => unsubscribe();
                };

                if (window.firebaseDB) {
                    initListener();
                } else {
                    window.addEventListener('firebase-ready', initListener);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const cleanSocieta = (val) => {
                if (!val) return 'MONTERONI VOLLEY A.S.D.';
                let str = val.toString().trim();
                str = str.replace(/^[\/\-\s]+/, '');
                return str.toUpperCase();
            };

            const getCertStatus = (dateStr) => {
                if (!dateStr) return 'red';
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const expiryDate = new Date(dateStr);
                expiryDate.setHours(0, 0, 0, 0);

                if (isNaN(expiryDate.getTime())) return 'red';

                if (expiryDate < today) {
                    return 'red'; // Scaduto
                }

                const twoMonthsFromNow = new Date(today);
                twoMonthsFromNow.setMonth(twoMonthsFromNow.getMonth() + 2);

                if (expiryDate <= twoMonthsFromNow) {
                    return 'yellow'; // In scadenza entro 2 mesi
                }

                return 'green'; // Valido
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!window.firebaseDB) return;

                const cfPulito = formData.codiceFiscale.trim().toUpperCase();

                if (!currentAtleta) {
                    const esiste = atlete.some(a => (a.codiceFiscale || '').trim().toUpperCase() === cfPulito);
                    if (esiste) {
                        alert("Atleta già inserita");
                        return;
                    }
                }

                const { db, collection, addDoc, updateDoc, doc, appId } = window.firebaseDB;
                const payload = {
                    ...formData,
                    cognomeNome: formData.cognomeNome.trim().toUpperCase(),
                    codiceFiscale: cfPulito,
                    societaAppartenenza: cleanSocieta(formData.societaAppartenenza),
                    updatedAt: new Date().toISOString()
                };

                try {
                    if (currentAtleta) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', currentAtleta.id), payload);
                        showToast("Atleta aggiornata con successo");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'), {
                            ...payload,
                            createdAt: new Date().toISOString()
                        });
                        showToast("Atleta inserita con successo");
                    }
                    setModalOpen(false);
                    resetForm();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    showToast("Errore durante il salvataggio", "error");
                }
            };

            const resetForm = () => {
                setFormData({
                    cognomeNome: '',
                    matricola: '',
                    anno: new Date().getFullYear().toString(),
                    codiceFiscale: '',
                    dataNascita: '',
                    societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                    categoria: '',
                    dataCertificato: '',
                    quotaIscrizione: '',
                    note: ''
                });
                setCurrentAtleta(null);
            };

            const handleDelete = async (id) => {
                if (!confirm("Sei sicuro di voler eliminare questa atleta?")) return;
                if (!window.firebaseDB) return;
                const { db, doc, deleteDoc, appId } = window.firebaseDB;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', id));
                    showToast("Atleta eliminata");
                } catch (err) {
                    console.error("Errore eliminazione:", err);
                    showToast("Errore durante l'eliminazione", "error");
                }
            };

            const handleClearDatabase = async () => {
                if (!confirm("ATTENZIONE: Stai per eliminare TUTTE le atlete presenti nel database cloud. Vuoi procedere?")) return;
                if (!confirm("Conferma definitiva: Vuoi davvero svuotare completamente l'archivio?")) return;
                
                if (!window.firebaseDB) return;
                const { db, doc, deleteDoc, appId } = window.firebaseDB;
                setLoading(true);

                try {
                    for (const atleta of atlete) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', atleta.id));
                    }
                    showToast("Archivio svuotato con successo");
                } catch (err) {
                    console.error("Errore svuotamento database:", err);
                    showToast("Errore durante lo svuotamento", "error");
                } finally {
                    setLoading(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const parsedAtlete = [];
                        rows.forEach((row) => {
                            const colA = row[0]; // Anno
                            const colB = row[1]; // Matricola
                            const colC = row[2]; // Cognome e Nome
                            const colE = row[4]; // Codice Fiscale
                            const colF = row[5]; // Data Nascita
                            const colP = row[15]; // Società Appartenenza
                            const colAB = row[27]; // Data Certificato

                            if (colC && colE) {
                                const nomeStr = colC.toString().trim().toUpperCase();
                                const cfStr = colE.toString().trim().toUpperCase();

                                if (nomeStr.includes('COGNOME') || cfStr.includes('CODICE') || cfStr.includes('CF')) {
                                    return;
                                }

                                parsedAtlete.push({
                                    anno: colA ? colA.toString() : new Date().getFullYear().toString(),
                                    matricola: colB ? colB.toString() : '',
                                    cognomeNome: nomeStr,
                                    codiceFiscale: cfStr,
                                    dataNascita: parseExcelDate(colF),
                                    societaAppartenenza: cleanSocieta(colP),
                                    categoria: '',
                                    dataCertificato: parseExcelDate(colAB),
                                    quotaIscrizione: '',
                                    note: ''
                                });
                            }
                        });

                        if (parsedAtlete.length === 0) {
                            alert("Nessuna atleta trovata nel file. Verifica la corrispondenza delle colonne.");
                            return;
                        }

                        setImportPreview(parsedAtlete);
                        setImportModalOpen(true);
                    } catch (err) {
                        console.error("Errore lettura file:", err);
                        alert("Errore nella lettura del file Excel/CSV.");
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const parseExcelDate = (val) => {
                if (!val) return '';
                if (typeof val === 'number') {
                    const date = XLSX.SSF.parse_date_code(val);
                    if (date) {
                        return `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                    }
                }
                return val.toString().trim();
            };

            const confirmImport = async () => {
                if (!window.firebaseDB || importPreview.length === 0) return;
                setImporting(true);

                const { db, collection, writeBatch, doc, appId } = window.firebaseDB;
                let duplicateCount = 0;
                let successCount = 0;

                try {
                    const existingCFs = new Set(atlete.map(a => (a.codiceFiscale || '').trim().toUpperCase()));
                    const validItems = [];

                    for (const atleta of importPreview) {
                        const cf = atleta.codiceFiscale;
                        if (existingCFs.has(cf)) {
                            duplicateCount++;
                            continue;
                        }
                        validItems.push(atleta);
                        existingCFs.add(cf);
                    }

                    const chunks = [];
                    for (let i = 0; i < validItems.length; i += 40) {
                        chunks.push(validItems.slice(i, i + 40));
                    }

                    for (const chunk of chunks) {
                        const batch = writeBatch(db);
                        for (const atleta of chunk) {
                            const newDocRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'));
                            batch.set(newDocRef, {
                                ...atleta,
                                createdAt: new Date().toISOString()
                            });
                        }
                        await batch.commit();
                        successCount += chunk.length;
                    }

                    if (duplicateCount > 0) {
                        alert(`Rilevate ${duplicateCount} atlete già presenti in archivio ("Atleta già inserita"). Saltate per evitare duplicati.`);
                    }

                    showToast(`Importate con successo ${successCount} atlete!`);
                    setImportModalOpen(false);
                    setImportPreview([]);
                } catch (err) {
                    console.error("Errore importazione batch:", err);
                    showToast("Errore durante l'importazione", "error");
                } finally {
                    setImporting(false);
                }
            };

            const filteredAtlete = useMemo(() => {
                return atlete.filter(a => {
                    const matchSearch = (a.cognomeNome || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.codiceFiscale || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.societaAppartenenza || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchCat = selectedCategory === 'TUTTE' || (a.categoria || '') === selectedCategory;
                    return matchSearch && matchCat;
                });
            }, [atlete, searchTerm, selectedCategory]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {toast && (
                        <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            {toast.message}
                        </div>
                    )}

                    <header className="bg-red-700 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="Logo ASD Monteroni Volley" className="w-12 h-12 object-contain bg-white rounded-full p-1 shadow" />
                                <div>
                                    <h1 className="text-xl font-bold tracking-wider">ASD MONTERONI VOLLEY</h1>
                                    <p className="text-xs text-red-100">Gestione Dirigenziale Atlete</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 items-center">
                                <label className="cursor-pointer bg-white text-red-700 hover:bg-red-50 font-semibold px-3 py-2 rounded-lg shadow text-xs sm:text-sm flex items-center gap-2 transition">
                                    <span data-lucide="upload" className="w-4 h-4"></span>
                                    Importa Excel / CSV
                                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <button onClick={() => { resetForm(); setModalOpen(true); }} className="bg-red-800 hover:bg-red-900 text-white px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center gap-2 border border-red-600 transition">
                                    <span data-lucide="user-plus" className="w-4 h-4"></span>
                                    Nuova Atleta
                                </button>
                                {atlete.length > 0 && (
                                    <button onClick={handleClearDatabase} className="bg-slate-800 hover:bg-slate-900 text-red-400 px-3 py-2 rounded-lg shadow text-xs sm:text-sm font-semibold flex items-center
