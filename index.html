<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASD Monteroni Volley Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS (xlsx) per leggere file Excel e CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurazione Firebase sicura tramite variabili globali o demo
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'monteroni-volley-atlete';

        window.firebaseDB = { db, auth, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDocs, appId };
        
        signInAnonymously(auth).catch((error) => {
            console.error("Errore autenticazione anonima:", error);
        });

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- Codice dell'Applicazione React -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const CATEGORIES = ['B2', '1D', 'U19', 'U17', 'U15', 'U13'];
        const PAYMENT_STATUSES = ['NON DOVUTO', 'DA PAGARE', 'PAGATO'];

        function App() {
            const [atlete, setAtlete] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('TUTTE');
            const [modalOpen, setModalOpen] = useState(false);
            const [importModalOpen, setImportModalOpen] = useState(false);
            const [currentAtleta, setCurrentAtleta] = useState(null);
            const [importPreview, setImportPreview] = useState([]);
            const [importing, setImporting] = useState(false);
            const [toast, setToast] = useState(null);

            // Form State
            const [formData, setFormData] = useState({
                cognomeNome: '',
                matricola: '',
                anno: new Date().getFullYear().toString(),
                codiceFiscale: '',
                dataNascita: '',
                societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                categoria: 'U17',
                dataCertificato: '',
                quotaIscrizione: 'DA PAGARE',
                note: ''
            });

            useEffect(() => {
                const initListener = () => {
                    if (!window.firebaseDB) {
                        setTimeout(initListener, 200);
                        return;
                    }
                    const { db, collection, onSnapshot, appId } = window.firebaseDB;
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'atlete');
                    
                    const unsubscribe = onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach((docSnap) => {
                            items.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setAtlete(items);
                        setLoading(false);
                    }, (error) => {
                        console.error("Errore lettura database:", error);
                        setLoading(false);
                        showToast("Errore di connessione al database", "error");
                    });

                    return () => unsubscribe();
                };

                if (window.firebaseDB) {
                    initListener();
                } else {
                    window.addEventListener('firebase-ready', initListener);
                }
            }, []);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Pulisci prefissi e slash dalla società
            const cleanSocieta = (val) => {
                if (!val) return 'MONTERONI VOLLEY A.S.D.';
                let str = val.toString().trim();
                // Rimuove slash o caratteri speciali iniziali
                str = str.replace(/^[\/\-\s]+/, '');
                return str.toUpperCase();
            };

            // Gestione form manuale
            const handleSave = async (e) => {
                e.preventDefault();
                if (!window.firebaseDB) return;

                const cfPulito = formData.codiceFiscale.trim().toUpperCase();

                // Controllo duplicati codice fiscale in inserimento manuale
                if (!currentAtleta) {
                    const esiste = atlete.some(a => (a.codiceFiscale || '').trim().toUpperCase() === cfPulito);
                    if (esiste) {
                        alert("Atleta già inserita");
                        return;
                    }
                }

                const { db, collection, addDoc, updateDoc, doc, appId } = window.firebaseDB;
                const payload = {
                    ...formData,
                    cognomeNome: formData.cognomeNome.trim().toUpperCase(),
                    codiceFiscale: cfPulito,
                    societaAppartenenza: cleanSocieta(formData.societaAppartenenza),
                    updatedAt: new Date().toISOString()
                };

                try {
                    if (currentAtleta) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', currentAtleta.id), payload);
                        showToast("Atleta aggiornata con successo");
                    } else {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'), {
                            ...payload,
                            createdAt: new Date().toISOString()
                        });
                        showToast("Atleta inserita con successo");
                    }
                    setModalOpen(false);
                    resetForm();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    showToast("Errore durante il salvataggio", "error");
                }
            };

            const resetForm = () => {
                setFormData({
                    cognomeNome: '',
                    matricola: '',
                    anno: new Date().getFullYear().toString(),
                    codiceFiscale: '',
                    dataNascita: '',
                    societaAppartenenza: 'MONTERONI VOLLEY A.S.D.',
                    categoria: 'U17',
                    dataCertificato: '',
                    quotaIscrizione: 'DA PAGARE',
                    note: ''
                });
                setCurrentAtleta(null);
            };

            const handleDelete = async (id) => {
                if (!confirm("Sei sicuro di voler eliminare questa atleta?")) return;
                if (!window.firebaseDB) return;
                const { db, doc, deleteDoc, appId } = window.firebaseDB;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'atlete', id));
                    showToast("Atleta eliminata");
                } catch (err) {
                    console.error("Errore eliminazione:", err);
                    showToast("Errore durante l'eliminazione", "error");
                }
            };

            // Lettura file Excel / CSV
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        // Scarta intestazioni se presenti (es. prime 4-5 righe o cerca righe con dati)
                        const parsedAtlete = [];
                        rows.forEach((row, idx) => {
                            // Supponiamo che i dati partano dalla riga con intestazioni o saltiamo le prime se vuote
                            const colA = row[0]; // Anno
                            const colB = row[1]; // Matricola
                            const colC = row[2]; // Cognome e Nome
                            const colE = row[4]; // Codice Fiscale
                            const colF = row[5]; // Data Nascita
                            const colP = row[15]; // Società Appartenenza (indice 15 = colonna P)
                            const colAB = row[27]; // Data Certificato (indice 27 = colonna AB)

                            if (colC && colE) {
                                parsedAtlete.push({
                                    anno: colA ? colA.toString() : new Date().getFullYear().toString(),
                                    matricola: colB ? colB.toString() : '',
                                    cognomeNome: colC.toString().trim().toUpperCase(),
                                    codiceFiscale: colE.toString().trim().toUpperCase(),
                                    dataNascita: parseExcelDate(colF),
                                    societaAppartenenza: cleanSocieta(colP),
                                    categoria: 'U17',
                                    dataCertificato: parseExcelDate(colAB),
                                    quotaIscrizione: 'DA PAGARE',
                                    note: ''
                                });
                            }
                        });

                        if (parsedAtlete.length === 0) {
                            alert("Nessuna atleta trovata nel file. Verifica che le colonne corrispondano (Cognome e Nome in col. C, CF in col. E).");
                            return;
                        }

                        setImportPreview(parsedAtlete);
                        setImportModalOpen(true);
                    } catch (err) {
                        console.error("Errore lettura file:", err);
                        alert("Errore nella lettura del file Excel/CSV. Assicurati che sia un formato valido.");
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const parseExcelDate = (val) => {
                if (!val) return '';
                if (typeof val === 'number') {
                    const date = XLSX.SSF.parse_date_code(val);
                    if (date) {
                        return `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                    }
                }
                return val.toString().trim();
            };

            // Salvataggio massivo sicuro a blocchi (anti-timeout)
            const confirmImport = async () => {
                if (!window.firebaseDB || importPreview.length === 0) return;
                setImporting(true);

                const { db, collection, addDoc, appId } = window.firebaseDB;
                let duplicateCount = 0;
                let successCount = 0;

                try {
                    // Controlla codici fiscali esistenti
                    const existingCFs = new Set(atlete.map(a => (a.codiceFiscale || '').trim().toUpperCase()));

                    for (const atleta of importPreview) {
                        const cf = atleta.codiceFiscale;
                        if (existingCFs.has(cf)) {
                            duplicateCount++;
                            continue;
                        }

                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'atlete'), {
                            ...atleta,
                            createdAt: new Date().toISOString()
                        });
                        existingCFs.add(cf); // Evita duplicati interni allo stesso file
                        successCount++;
                    }

                    if (duplicateCount > 0) {
                        alert(`Atleta già inserita riscontrata per ${duplicateCount} elementi (saltati per evitare duplicati).`);
                    }

                    showToast(`Importate con successo ${successCount} atlete!`);
                    setImportModalOpen(false);
                    setImportPreview([]);
                } catch (err) {
                    console.error("Errore importazione batch:", err);
                    showToast("Errore durante l'importazione", "error");
                } finally {
                    setImporting(false);
                }
            };

            const filteredAtlete = useMemo(() => {
                return atlete.filter(a => {
                    const matchSearch = (a.cognomeNome || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.codiceFiscale || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (a.societaAppartenenza || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchCat = selectedCategory === 'TUTTE' || a.categoria === selectedCategory;
                    return matchSearch && matchCat;
                });
            }, [atlete, searchTerm, selectedCategory]);

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-white font-medium flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            {toast.message}
                        </div>
                    )}

                    {/* Header Istituzionale */}
                    <header className="bg-red-700 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="./logo.png" alt="Logo ASD Monteroni Volley" className="w-12 h-12 object-contain bg-white rounded-full p-1 shadow" />
                                <div>
                                    <h1 className="text-xl font-bold tracking-wider">ASD MONTERONI VOLLEY</h1>
                                    <p className="text-xs text-red-100">Gestione Dirigenziale Atlete</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 items-center">
                                <label className="cursor-pointer bg-white text-red-700 hover:bg-red-50 font-semibold px-4 py-2 rounded-lg shadow text-sm flex items-center gap-2 transition">
                                    <span data-lucide="upload" className="w-4 h-4"></span>
                                    Importa Excel / CSV
                                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                                </label>
                                <button onClick={() => { resetForm(); setModalOpen(true); }} className="bg-red-800 hover:bg-red-900 text-white px-4 py-2 rounded-lg shadow text-sm font-semibold flex items-center gap-2 border border-red-600 transition">
                                    <span data-lucide="user-plus" className="w-4 h-4"></span>
                                    Nuova Atleta
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Contenuto Principale */}
                    <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
                        {/* Filtri e Ricerca */}
                        <div className="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
                            <div className="relative w-full md:w-96">
                                <span data-lucide="search" className="absolute left-3 top-3 w-5 h-5 text-slate-400"></span>
                                <input 
                                    type="text" 
                                    placeholder="Cerca per cognome, nome, CF, società..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 text-sm"
                                />
                            </div>
                            <div className="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                                <button 
                                    onClick={() => setSelectedCategory('TUTTE')}
                                    className={`px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap ${selectedCategory === 'TUTTE' ? 'bg-red-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                >
                                    Tutte ({atlete.length})
                                </button>
                                {CATEGORIES.map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap ${selectedCategory === cat ? 'bg-red-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Tabella Atlete */}
                        <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                            {loading ? (
                                <div className="p-12 text-center text-slate-500">Caricamento archivio in corso...</div>
                            ) : filteredAtlete.length === 0 ? (
                                <div className="p-12 text-center text-slate-500">Nessuna atleta trovata in archivio.</div>
                            ) : (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                                                <th className="p-3">Matr.</th>
                                                <th className="p-3">Cognome e Nome</th>
                                                <th className="p-3">Codice Fiscale</th>
                                                <th className="p-3">Nascita</th>
                                                <th className="p-3">Categoria</th>
                                                <th className="p-3">Società Appartenenza</th>
                                                <th className="p-3">Certificato</th>
                                                <th className="p-3">Quota</th>
                                                <th className="p-3 text-right">Azioni</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 text-sm">
                                            {filteredAtlete.map(atleta => (
                                                <tr key={atleta.id} className="hover:bg-slate-50 transition">
                                                    <td className="p-3 font-mono text-xs text-slate-500">{atleta.matricola || '-'}</td>
                                                    <td className="p-3 font-semibold text-slate-900">{atleta.cognomeNome}</td>
                                                    <td className="p-3 font-mono text-xs text-slate-600">{atleta.codiceFiscale}</td>
                                                    <td className="p-3 text-slate-600">{atleta.dataNascita}</td>
                                                    <td className="p-3">
                                                        <span className="px-2 py-0.5 bg-red-100 text-red-800 rounded font-medium text-xs">{atleta.categoria || 'U17'}</span>
                                                    </td>
                                                    <td className="p-3 text-slate-700 font-medium">{atleta.societaAppartenenza}</td>
                                                    <td className="p-3 text-slate-600">
                                                        <span className={`px-2 py-0.5 rounded text-xs font-medium ${atleta.dataCertificato && new Date(atleta.dataCertificato) > new Date() ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                            {atleta.dataCertificato || 'Scaduto/Assente'}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-0.5 rounded text-xs font-semibold ${atleta.quotaIscrizione === 'PAGATO' ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800'}`}>
                                                            {atleta.quotaIscrizione}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-right">
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={() => { setCurrentAtleta(atleta); setFormData(atleta); setModalOpen(true); }} className="p-1.5 hover:bg-slate-200 rounded text-slate-600 transition" title="Modifica">
                                                                <span data-lucide="edit-3" className="w-4 h-4"></span>
                                                            </button>
                                                            <button onClick={() => handleDelete(atleta.id)} className="p-1.5 hover:bg-red-100 rounded text-red-600 transition" title="Elimina">
                                                                <span data-lucide="trash-2" className="w-4 h-4"></span>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Modale Inserimento / Modifica Atleta */}
                    {modalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-950">{currentAtleta ? 'Modifica Atleta' : 'Nuova Atleta'}</h3>
                                    <button onClick={() => setModalOpen(false)} className="p-1 hover:bg-slate-100 rounded-full">
                                        <span data-lucide="x" className="w-5 h-5 text-slate-500"></span>
                                    </button>
                                </div>
                                <form onSubmit={handleSave} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Cognome e Nome</label>
                                        <input 
                                            type="text" 
                                            required 
                                            value={formData.cognomeNome}
                                            onChange={e => setFormData({...formData, cognomeNome: e.target.value})}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Numero Matricola</label>
                                            <input 
                                                type="text" 
                                                value={formData.matricola}
                                                onChange={e => setFormData({...formData, matricola: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Anno</label>
                                            <input 
                                                type="text" 
                                                value={formData.anno}
                                                onChange={e => setFormData({...formData, anno: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Codice Fiscale</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={formData.codiceFiscale}
                                                onChange={e => setFormData({...formData, codiceFiscale: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Nascita</label>
                                            <input 
                                                type="date" 
                                                value={formData.dataNascita}
                                                onChange={e => setFormData({...formData, dataNascita: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoria</label>
                                            <select 
                                                value={formData.categoria}
                                                onChange={e => setFormData({...formData, categoria: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Quota Iscrizione</label>
                                            <select 
                                                value={formData.quotaIscrizione}
                                                onChange={e => setFormData({...formData, quotaIscrizione: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white"
                                            >
                                                {PAYMENT_STATUSES.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Società Appartenenza (Prestiti)</label>
                                        <input 
                                            type="text" 
                                            value={formData.societaAppartenenza}
                                            onChange={e => setFormData({...formData, societaAppartenenza: e.target.value})}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Certificato Medico</label>
                                        <input 
                                            type="date" 
                                            value={formData.dataCertificato}
                                            onChange={e => setFormData({...formData, dataCertificato: e.target.value})}
                                            className="w-full p-2.5 border border-slate-300 rounded-lg text-sm"
                                        />
                                    </div>
                                    <div className="flex justify-end gap-3 pt-4 border-t">
                                        <button type="button" onClick={() => setModalOpen(false)} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                                        <button type="submit" className="px-5 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg text-sm font-semibold shadow">Salva Atleta</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modale Anteprima Importazione */}
                    {importModalOpen && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-xl max-h-[90vh] flex flex-col">
                                <h3 className="text-lg font-bold text-slate-950 mb-2">Anteprima Importazione ({importPreview.length} Atlete Rilevate)</h3>
                                <p className="text-xs text-slate-500 mb-4">Verifica i dati estratti dal file prima di procedere al salvataggio definitivo nel cloud.</p>
                                
                                <div className="flex-1 overflow-y-auto border border-slate-200 rounded-xl mb-4">
                                    <table className="w-full text-left border-collapse text-xs">
                                        <thead className="bg-slate-50 sticky top-0 border-b">
                                            <tr>
                                                <th className="p-2.5">Nome e Cognome</th>
                                                <th className="p-2.5">CF</th>
                                                <th className="p-2.5">Nascita</th>
                                                <th className="p-2.5">Società</th>
                                                <th className="p-2.5">Certificato</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {importPreview.map((item, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-2.5 font-bold">{item.cognomeNome}</td>
                                                    <td className="p-2.5 font-mono">{item.codiceFiscale}</td>
                                                    <td className="p-2.5">{item.dataNascita}</td>
                                                    <td className="p-2.5">{item.societaAppartenenza}</td>
                                                    <td className="p-2.5">{item.dataCertificato}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="flex justify-end gap-3 pt-2 border-t">
                                    <button onClick={() => setImportModalOpen(false)} disabled={importing} className="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Annulla</button>
                                    <button onClick={confirmImport} disabled={importing} className="px-6 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-sm font-semibold shadow flex items-center gap-2">
                                        {importing ? 'Salvataggio in corso...' : 'Conferma e Salva in Archivio'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Inizializza le icone Lucide dopo il rendering
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 500);
    </script>
</body>
</html>
